<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2c6a4c">
<title>Quản lý công việc Trade MKT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Bố cục: thanh trên cố định + vùng nội dung một cột, bảng là trung tâm */
  --bg:#f3f5f2; --surface:#ffffff; --ink:#1c2621; --muted:#5d6a63; --line:#dde3dc; --soft:#eaf0ea;
  --accent:#2c6a4c; --accent-ink:#ffffff; --accent-soft:#e1efe6;
  --ok:#23804f; --ok-soft:#e1f2e8; --warn:#a86d00; --warn-soft:#fbf0d9; --bad:#b9381f; --bad-soft:#fbe5df; --info:#2a5f8f; --info-soft:#e2edf7;
  --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --r:10px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121815; --surface:#1a221e; --ink:#e6ece8; --muted:#9aa8a0; --line:#2c3732; --soft:#202a25;
    --accent:#6dbb92; --accent-ink:#0e1612; --accent-soft:#1f3529;
    --ok:#6cc595; --ok-soft:#1c3226; --warn:#e2b04f; --warn-soft:#352b17; --bad:#f08a72; --bad-soft:#3a201a; --info:#7fb2e0; --info-soft:#1b2b3a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121815; --surface:#1a221e; --ink:#e6ece8; --muted:#9aa8a0; --line:#2c3732; --soft:#202a25;
  --accent:#6dbb92; --accent-ink:#0e1612; --accent-soft:#1f3529;
  --ok:#6cc595; --ok-soft:#1c3226; --warn:#e2b04f; --warn-soft:#352b17; --bad:#f08a72; --bad-soft:#3a201a; --info:#7fb2e0; --info-soft:#1b2b3a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance;margin:0}
.num,td.n,.tile b{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{max-width:1200px;margin:0 auto;padding:12px 20px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center}
.brand{display:flex;flex-direction:column}
.brand h1{font-size:17px;font-weight:700;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--muted)}
nav{display:flex;gap:4px;flex-wrap:wrap;flex:1}
nav a{padding:7px 12px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:500}
nav a:hover{background:var(--soft);color:var(--ink)}
nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}

main{max-width:1200px;margin:0 auto;padding:20px;display:grid;gap:20px}
.notice{padding:10px 14px;border-radius:var(--r);background:var(--warn-soft);color:var(--ink);border:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.notice.info{background:var(--info-soft)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:2px}
.tile span{color:var(--muted);font-size:13px}
.tile b{font-size:28px;font-weight:700;line-height:1.2}
.tile small{color:var(--muted);font-size:12px}
.tile.bad b{color:var(--bad)} .tile.warn b{color:var(--warn)}
section.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--line)}
.card-h h2{font-size:15px;font-weight:600}
.card-h p{margin:0;color:var(--muted);font-size:12.5px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:8px 12px;background:var(--soft);white-space:nowrap}
td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right}
tr.click{cursor:pointer} tr.click:hover td{background:var(--soft)}
.empty{padding:22px 16px;color:var(--muted)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.info{background:var(--info-soft);color:var(--info)}
.pill.neutral{background:var(--soft);color:var(--muted)}
.prog{display:flex;align-items:center;gap:8px;min-width:140px}
.prog i{flex:1;height:7px;border-radius:9px;background:var(--soft);position:relative;overflow:hidden;display:block}
.prog i::after{content:"";position:absolute;inset:0;width:var(--w);background:var(--accent);border-radius:9px}
.prog span{font-size:12px;color:var(--muted);min-width:34px;text-align:right}
.muted{color:var(--muted)} .sub{font-size:12px;color:var(--muted)}
.late{color:var(--bad);font-weight:600}
.filters{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.filters input,.filters select{padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.filters input{min-width:200px;flex:1}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:20px}

/* chi tiết hoạt động */
.detail-h{display:grid;gap:10px;padding:16px}
.detail-h .row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.detail-h h2{font-size:19px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--soft);border-radius:6px;padding:2px 8px;font-size:12.5px;color:var(--muted)}
.steps td{padding:6px 8px}
.steps input,.steps select{width:100%;padding:5px 7px;border:1px solid transparent;border-radius:6px;background:transparent;min-width:0}
.steps input:hover,.steps select:hover{border-color:var(--line)}
.steps input:focus,.steps select:focus{border-color:var(--accent);background:var(--surface);outline:none}
.steps select{border-color:var(--line)}
.steps tr.is-late td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
.steps tr.is-done td{color:var(--muted)}
.steps tr.is-done input.ten{text-decoration:line-through}
.st-chua{color:var(--muted)} .st-dang{color:var(--info)} .st-cho{color:var(--warn)} .st-xong{color:var(--ok)} .st-bo{color:var(--muted)}

.group h3{font-size:13px;padding:10px 16px;background:var(--soft);border-top:1px solid var(--line);display:flex;gap:8px;align-items:center}
.group:first-child h3{border-top:0}
.gantt{min-width:880px}
.g-row{display:grid;grid-template-columns:210px 1fr;border-top:1px solid var(--line)}
.g-row.head{border-top:0;position:sticky;top:0;background:var(--surface);z-index:2}
.g-lab{padding:6px 10px;font-size:13px;line-height:1.3;border-right:1px solid var(--line)}
.g-lab b{display:block}
.g-lab.chuoi-dau{border-top:2px solid var(--line)}
.g-track{position:relative;min-height:34px}
.g-mon{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);font-size:12px;color:var(--muted);padding:8px 0 0 4px;white-space:nowrap;overflow:hidden}
.g-sep{position:absolute;top:0;bottom:0;border-left:1px dashed var(--line)}
.g-today{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);opacity:.55;z-index:1}
.g-bar{position:absolute;height:24px;border-radius:6px;padding:0 6px;font:inherit;font-size:12px;line-height:22px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border:1px solid var(--line);cursor:pointer;text-align:left;background:var(--soft);color:var(--ink)}
.g-bar.on{background:var(--info-soft);color:var(--info);border-color:transparent}
.g-bar.off{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.g-bar.co{box-shadow:inset 0 0 0 2px var(--ok)}
.g-bar:hover,.g-bar:focus-visible{filter:brightness(.95);z-index:3}
.g-legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:12.5px;color:var(--muted);padding:8px 16px}
.g-legend i{display:inline-block;width:14px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}
.lp-nd{white-space:pre-wrap;background:var(--soft);border-radius:8px;padding:10px 12px;margin:0}

/* quy trình mẫu */
.tpl-list{display:grid;gap:16px}
ol.tsteps{margin:0;padding:10px 16px 14px 36px;display:grid;gap:4px}
ol.tsteps li{padding-left:4px}
ol.tsteps .when{color:var(--muted);font-size:12px}

/* hộp thoại */
.backdrop{position:fixed;inset:0;background:rgba(10,16,13,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:20}
.dialog{background:var(--surface);border-radius:12px;width:min(860px,100%);border:1px solid var(--line);box-shadow:0 20px 50px rgba(0,0,0,.25)}
.dialog.small{width:min(440px,100%)}
.dialog header{position:static;padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;background:transparent}
.dialog header h2{font-size:16px}
.dialog .body{padding:16px 18px;display:grid;gap:14px}
.dialog footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.field{display:grid;gap:4px}
.field label{font-size:12.5px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);width:100%}
.field.full{grid-column:1/-1}
.preview{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.ed td{padding:5px 6px}
.ed input,.ed select{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);min-width:0}
.hint{font-size:12.5px;color:var(--muted);margin:0}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:30;max-width:90vw;font-size:13.5px}
@media (max-width:640px){ .bar{padding:10px 16px} main{padding:16px} .filters input{min-width:0} }
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.who{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted)}
.auth{max-width:420px;margin:40px auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px;display:grid;gap:14px}
.auth h2{font-size:18px}
.auth .row{display:flex;gap:8px;flex-wrap:wrap}
.link,.auth .link{background:none;text-align:left;font:inherit;border:0;color:var(--accent);cursor:pointer;padding:0;font-weight:500;text-decoration:underline}
.err{color:var(--bad);font-size:13px;margin:0}
.ok-msg{color:var(--ok);font-size:13px;margin:0}
.addrow{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line)}
.addrow input,.addrow select{padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.addrow input{flex:1;min-width:160px}
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand"><h1>Quản lý công việc Trade MKT</h1><span>Trí Việt Phát · quy trình, giao việc, tiến độ</span></div>
    <nav id="nav" hidden>
      <a href="#tong-quan" data-v="tong-quan">Tổng quan</a>
      <a href="#hoat-dong" data-v="hoat-dong">Hoạt động</a>
      <a href="#lich-viec" data-v="lich-viec">Lịch việc</a>
      <a href="#lich-post" data-v="lich-post">Lịch post</a>
      <a href="#quy-trinh" data-v="quy-trinh">Quy trình mẫu</a>
      <a href="#thanh-vien" data-v="thanh-vien">Thành viên</a>
    </nav>
    <button class="btn pri" id="btnNew" type="button" hidden>+ Tạo hoạt động</button>
    <div class="who" id="who" hidden></div>
  </div>
</header>
<main id="main"><div class="empty">Đang khởi động…</div></main>
<div id="modal"></div>
<div id="toast" class="toast" hidden></div>

<script src="cau-hinh.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js"></script>
<script>
const CFG = window.CAU_HINH || {};
const TT = {chua:'Chưa làm', dang:'Đang làm', cho:'Chờ duyệt', xong:'Xong', bo:'Không áp dụng'};
const TT_DB = {chua:'chua_lam', dang:'dang_lam', cho:'cho_duyet', xong:'xong', bo:'khong_ap_dung'};
const TT_APP = {chua_lam:'chua', dang_lam:'dang', cho_duyet:'cho', xong:'xong', khong_ap_dung:'bo'};
const MOC_DB = {bd:'bat_dau', kt:'ket_thuc'}, MOC_APP = {bat_dau:'bd', ket_thuc:'kt'};
const TTHD = {chuabd:['Chưa bắt đầu','neutral'], dangchay:['Đang chạy','info'], tre:['Có việc trễ','bad'], hoanthanh:['Hoàn thành','ok']};
const VIEWS = ['tong-quan','hoat-dong','lich-viec','lich-post','quy-trinh','thanh-vien'];

let sb = null, session = null, members = [], NH = [], HT = [], templates = [], acts = [];
let lichPost = [], dongBoLich = null, lichLoc = {chuoi:'', nhan:'', loai:'', tu:'', soThang:'3'};
let loaded = false, authed = false, inflight = 0, reloadTimer = null, channel = null;
let view = 'tong-quan', selectedId = null, pendingRender = false, notice = '';
let filters = {q:'', nhan:'', kenh:'', tt:''}, calPerson = '';
let modal = null, authMode = 'login', authMsg = {err:'', ok:''};
const main = document.getElementById('main');

/* ---------- tiện ích ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDays(s,n){ if(!s) return ''; const [y,m,d]=s.split('-').map(Number); return new Date(Date.UTC(y,m-1,d+Number(n||0))).toISOString().slice(0,10); }
function diff(a,b){ const p=a.split('-').map(Number), q=b.split('-').map(Number); return Math.round((Date.UTC(q[0],q[1]-1,q[2])-Date.UTC(p[0],p[1]-1,p[2]))/86400000); }
function fd(s){ if(!s) return '—'; const [y,m,d]=s.split('-'); return d+'/'+m+'/'+y; }
const isOpen = s => s.trangThai==='chua' || s.trangThai==='dang' || s.trangThai==='cho';
const isLate = s => isOpen(s) && s.han && s.han < todayStr();
function moTaMoc(b){ const n=Number(b.soNgay||0); const moc=b.moc==='kt'?'ngày kết thúc':'ngày bắt đầu'; if(n===0) return 'Đúng '+moc; return (n<0? (-n)+' ngày trước ':n+' ngày sau ')+moc; }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true,4500); }
const myEmail = () => (session?.user?.email||'').toLowerCase();
const me = () => members.find(m=>m.email===myEmail());
const isManager = () => me()?.vai_tro==='quan_ly';
/* Khách: chỉ xem. Cơ sở dữ liệu đã chặn mọi thao tác ghi; phần dưới đây ẩn nút sửa cho gọn */
const laKhach = () => me()?.vai_tro==='khach';
const NUT_SUA = '[data-tao-lp],[data-done],[data-duyet],[data-tralai],[data-delstep],[data-sua-qt],[data-del-member],[data-gop],[data-act="them-buoc"],[data-act="sua-hd"],[data-act="xoa-hd"],[data-act="tao-qt"],[data-act="them-tv"]';
const O_LOC = ['fq','fnhan','fkenh','ftt','fnguoi','pMode','pTu','pDen','lpChuoi','lpNhan','lpLoai','lpTu','lpSo'];
function khoaChiXem(goc){
  goc.querySelectorAll(NUT_SUA).forEach(el=>el.remove());
  goc.querySelectorAll('input,select,textarea').forEach(el=>{ if(!O_LOC.includes(el.id)) el.disabled=true; });
}
/* Người làm: so tên không phân biệt hoa/thường và khoảng trắng thừa, ưu tiên cách viết trong danh sách thành viên */
const khoaTen = n => String(n||'').normalize('NFC').trim().replace(/\s+/g,' ').toLocaleLowerCase('vi');
let _bangTen = null;
function bangTen(){
  if(_bangTen) return _bangTen;
  const m=new Map();
  nguoiLamDuoc().forEach(x=>{ const k=khoaTen(x.ho_ten); if(k && !m.has(k)) m.set(k, String(x.ho_ten).trim().replace(/\s+/g,' ')); });
  acts.forEach(a=>(a.buoc||[]).forEach(b=>{ const k=khoaTen(b.nguoi); if(k && !m.has(k)) m.set(k, String(b.nguoi).trim().replace(/\s+/g,' ')); }));
  return (_bangTen=m);
}
const tenNguoi = n => { const k=khoaTen(n); return k ? (bangTen().get(k)||String(n).trim()) : ''; };
const nguoiLamDuoc = () => members.filter(m=>m.vai_tro!=='khach');
const laThanhVien = n => { const k=khoaTen(n); return !!k && nguoiLamDuoc().some(m=>khoaTen(m.ho_ten)===k); };
const tenThanhVien = () => [...new Set(nguoiLamDuoc().map(m=>String(m.ho_ten||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'vi'));
function people(){ return [...new Set(bangTen().values())].sort((a,b)=>a.localeCompare(b,'vi')); }
/* Duyệt: bước có người duyệt thì chỉ người duyệt hoặc quản lý mới chuyển sang Xong (cơ sở dữ liệu cũng chặn) */
const coQuyenDuyet = s => !laKhach() && (isManager() || (khoaTen(s.nguoiDuyet)!=='' && khoaTen(me()?.ho_ten)===khoaTen(s.nguoiDuyet)));
const phuTrach = s => s.trangThai==='cho' ? s.nguoiDuyet : s.nguoi;   // ai đang phải xử lý bước này
function nutXuLy(a,i,s){
  if(s.trangThai==='cho') return coQuyenDuyet(s)
    ? `<button class="btn sm pri" data-duyet="${esc(a.id)}:${i}" type="button">Duyệt</button> <button class="btn sm" data-tralai="${esc(a.id)}:${i}" type="button">Trả lại</button>`
    : `<span class="sub">Chờ ${esc(tenNguoi(s.nguoiDuyet))} duyệt</span>`;
  return `<button class="btn sm" data-done="${esc(a.id)}:${i}" type="button">${s.nguoiDuyet?'Hoàn tất, gửi duyệt':'Đánh dấu xong'}</button>`;
}
function chonNguoi(cur, attrs, trong='Chưa giao'){
  const k=khoaTen(cur), ds=tenThanhVien();
  let o=`<option value="" ${!k?'selected':''}>${esc(trong)}</option>`+ds.map(x=>`<option value="${esc(x)}" ${khoaTen(x)===k?'selected':''}>${esc(x)}</option>`).join('');
  if(k && !ds.some(x=>khoaTen(x)===k)) o+=`<option value="${esc(cur)}" selected>${esc(tenNguoi(cur))} (ngoài danh sách thành viên)</option>`;
  return `<select ${attrs}>${o}</select>`;
}
const nameOf = (arr,id) => arr.find(x=>x.id===id)?.ten || '';
function stats(a){
  const st=a.buoc||[]; const tinh=st.filter(s=>s.trangThai!=='bo'); const xong=tinh.filter(s=>s.trangThai==='xong').length;
  const tre=st.filter(isLate).length; const pct=tinh.length?Math.round(xong*100/tinh.length):0;
  let tt; if(tinh.length && xong===tinh.length) tt='hoanthanh'; else if(tre) tt='tre'; else if(xong===0 && !st.some(s=>s.trangThai==='dang')) tt='chuabd'; else tt='dangchay';
  return {tong:tinh.length, xong, tre, pct, tt};
}
const pill = tt => `<span class="pill ${TTHD[tt][1]}">${TTHD[tt][0]}</span>`;
const prog = p => `<div class="prog"><i style="--w:${p}%"></i><span class="num">${p}%</span></div>`;
const optObj = (arr, sel, blank) => (blank!=null?`<option value="">${esc(blank)}</option>`:'') + arr.map(v=>`<option value="${v.id}" ${String(v.id)===String(sel)?'selected':''}>${esc(v.ten)}</option>`).join('');
function errText(e){
  if(!e) return 'Lỗi không rõ';
  if(e.code==='42501') return 'Bạn không có quyền làm việc này.';
  if(e.code==='23514') return 'Dữ liệu không hợp lệ (kiểm tra lại ngày hoặc ô bắt buộc).';
  if(e.code==='23505') return 'Dữ liệu bị trùng.';
  if(e.code==='P0001') return e.message;
  if(/Failed to fetch|NetworkError/i.test(e.message||'')) return 'Mất kết nối mạng.';
  return e.message || String(e);
}

/* ---------- đọc dữ liệu ---------- */
async function fetchAll(table, orderCol){
  const out=[]; const size=1000;
  for(let from=0;;from+=size){
    let q=sb.from(table).select('*');
    if(orderCol) q=q.order(orderCol);
    const {data,error}=await q.order('id').range(from,from+size-1);
    if(error) throw error; out.push(...data); if(data.length<size) break;
  }
  return out;
}
const byThuTu = (a,b)=>(a.thu_tu??0)-(b.thu_tu??0);
function stepFromDb(b){ return {id:b.id, thuTu:b.thu_tu, ten:b.ten, vaiTro:b.vai_tro, nguoi:b.nguoi_lam, moc:b.moc?MOC_APP[b.moc]:null, soNgay:b.so_ngay, han:b.han||'', trangThai:TT_APP[b.trang_thai]||'chua', ngayXong:b.ngay_xong||'', ketQua:b.ket_qua, ghiChu:b.ghi_chu, nguoiDuyet:b.nguoi_duyet||'', ngayNop:b.ngay_nop||'', lyDoTra:b.ly_do_tra||''}; }

      fetchAll('quy_trinh','thu_tu'), fetchAll('quy_trinh_buoc'), fetchAll('hoat_dong','ngay_bat_dau'), fetchAll('buoc_cong_viec')]);

    const g={}; bc.forEach(b=>(g[b.hoat_dong_id] ||= []).push(b));
    acts=hd.map(h=>({id:h.id, ten:h.ten, quyTrinhId:h.quy_trinh_id, quyTrinhTen:h.quy_trinh_ten, nhanId:h.nhan_hang_id, kenhId:h.he_thong_id,
      nhan:nameOf(nh,h.nhan_hang_id), kenh:nameOf(ht,h.he_thong_id), bd:h.ngay_bat_dau, kt:h.ngay_ket_thuc,
      buoc:(g[h.id]||[]).sort(byThuTu).map(stepFromDb)}));
    if(notice.startsWith('Không tải')) notice='';
  }catch(e){ console.error(e); notice='Không tải được dữ liệu: '+errText(e); }
  try{ // lịch post: bảng có thể chưa có nếu chưa chạy SQL mới, khi đó trang Lịch post báo trống
    const [lp, db] = await Promise.all([fetchAll('lich_post','ngay_bat_dau'), sb.from('dong_bo_lich').select('*').then(r=>{ if(r.error) throw r.error; return r.data; })]);
    lichPost = lp.map(x=>({...x, ngay_bat_dau:String(x.ngay_bat_dau).slice(0,10), ngay_ket_thuc:String(x.ngay_ket_thuc).slice(0,10)})); dongBoLich = (db||[])[0]||null;
  }catch(e){ console.warn('Chưa đọc được lịch post', e); lichPost=[]; dongBoLich=null; }

/* ---------- ghi dữ liệu (mỗi nhóm ghi lần lượt) ---------- */
const queues = {};
function run(key, fn){
  inflight++;
  queues[key] = (queues[key]||Promise.resolve()).then(async()=>{
    const r = await fn(); if(r && r.error) throw r.error; return r;
  }).catch(e=>{ console.error(e); toast('Không lưu được: '+errText(e)); }).finally(()=>{ inflight--; scheduleReload(); });
  return queues[key];
}
const must = r => { if(r.error) throw r.error; return r.data; };

function allSteps(){ const r=[]; acts.forEach(a=>(a.buoc||[]).forEach((s,i)=>r.push({a,s,i}))); return r; }


let period={mode:'tuan', off:0, tu:'', den:''};
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function periodRange(){
  const d=new Date();
  if(period.mode==='thang'){ const a=new Date(d.getFullYear(), d.getMonth()+period.off, 1), b=new Date(d.getFullYear(), d.getMonth()+period.off+1, 0); return [ymd(a), ymd(b)]; }
  if(period.mode==='tuy-chon'){ const a=period.tu||ymd(new Date(d.getFullYear(),d.getMonth(),1)), b=period.den||todayStr(); return a<=b?[a,b]:[b,a]; }
  const day=(d.getDay()+6)%7; const mon=new Date(d.getFullYear(),d.getMonth(),d.getDate()-day+7*period.off); const s=ymd(mon); return [s, addDays(s,6)];
}
function periodLabel(){
  const o=period.off, m=period.mode;
  if(m==='tuy-chon') return 'Khoảng tự chọn';
  if(m==='thang'){ const d=new Date(); const a=new Date(d.getFullYear(), d.getMonth()+o, 1); return (o===0?'Tháng này':o===-1?'Tháng trước':o===1?'Tháng sau':'Tháng')+' ('+String(a.getMonth()+1).padStart(2,'0')+'/'+a.getFullYear()+')'; }
  return o===0?'Tuần này':o===-1?'Tuần trước':o===1?'Tuần sau':(o<0?(-o)+' tuần trước':o+' tuần sau');
}
function renderWeek(){
  const [ws,we]=periodRange(); const t=todayStr();
  const rows={};
  allSteps().forEach(({s})=>{
    if(s.trangThai==='bo'||!s.han||s.han<ws||s.han>we) return;
    const k=tenNguoi(s.nguoi)||'Chưa giao'; const o=rows[k]||(rows[k]={tong:0,xong:0,dungHan:0,mo:0,tre:0});
    o.tong++;
    if(s.trangThai==='xong'){ o.xong++; if(s.ngayXong && s.ngayXong<=s.han) o.dungHan++; }
    else { o.mo++; if(s.han<t) o.tre++; }
  });
  const list=Object.entries(rows).sort((a,b)=>a[0]==='Chưa giao'?1:b[0]==='Chưa giao'?-1:a[0].localeCompare(b[0],'vi'));
  const tong=list.reduce((m,[,o])=>{ for(const k in o) m[k]=(m[k]||0)+o[k]; return m; },{tong:0,xong:0,dungHan:0,mo:0,tre:0});
  const pct=o=>o.tong?Math.round(o.xong*100/o.tong):0;
  const donVi=period.mode==='thang'?'Tháng':'Tuần';
  const row=(k,o,total)=>`<tr ${total?'':`class="click" data-person="${esc(k)}"`}><td>${total?'<b>Cả nhóm</b>':esc(k)}</td><td class="n">${o.tong}</td><td class="n">${o.xong}</td><td>${prog(pct(o))}</td><td class="n">${o.xong?o.dungHan+'/'+o.xong:'—'}</td><td class="n">${o.mo}</td><td class="n ${o.tre?'late':''}">${o.tre}</td></tr>`;
  const nav = period.mode==='tuy-chon'
    ? `<label class="sub" for="pTu">Từ</label><input type="date" id="pTu" value="${esc(ws)}"><label class="sub" for="pDen">đến</label><input type="date" id="pDen" value="${esc(we)}">`
    : `<button class="btn sm" data-pnav="-1" type="button">‹ ${donVi} trước</button><button class="btn sm" data-pnav="0" type="button" ${period.off===0?'disabled':''}>${donVi} này</button><button class="btn sm" data-pnav="1" type="button">${donVi} sau ›</button>`;
  return `<section class="card"><div class="card-h"><div><h2>Tiến độ theo từng người</h2><p>${periodLabel()}: ${fd(ws)} – ${fd(we)} · tính các bước có hạn trong khoảng này, không tính bước “Không áp dụng”</p></div>
    <div class="filters" style="padding:0;border:0;align-items:center"><select id="pMode" aria-label="Chọn cách xem"><option value="tuan" ${period.mode==='tuan'?'selected':''}>Theo tuần</option><option value="thang" ${period.mode==='thang'?'selected':''}>Theo tháng</option><option value="tuy-chon" ${period.mode==='tuy-chon'?'selected':''}>Khoảng thời gian</option></select>${nav}</div></div>
    ${list.length?`<div class="scroll"><table><thead><tr><th>Người làm</th><th class="n">Việc đến hạn</th><th class="n">Đã xong</th><th>% hoàn thành</th><th class="n">Xong đúng hạn</th><th class="n">Còn lại</th><th class="n">Đang trễ</th></tr></thead><tbody>${list.map(([k,o])=>row(k,o)).join('')}${list.length>1?row('',tong,true):''}</tbody></table></div><p class="hint" style="padding:8px 16px 12px">Bấm vào tên một người để xem danh sách việc của người đó.</p>`:`<div class="empty">Không có bước nào đến hạn trong khoảng này.</div>`}
  </section>`;
}

function renderCal(){

/* ---------- Lịch post (từ Google Sheet kế hoạch) ---------- */
const boDau = s => String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/gi,'d').toLowerCase().replace(/[^a-z0-9]/g,'');
function khopKenh(chuoi){ const c=boDau(chuoi); if(!c) return null;
  return HT.find(h=>String(h.ten).split('/').map(boDau).some(t=>t && (t===c || (t.length>=3 && c.includes(t))))) || null; }
function khopNhan(nhan){ const c=boDau(nhan); if(!c) return null;
  return NH.find(n=>{ const t=boDau(n.ten); return t.length>=3 && c.includes(t); }) || null; }
function hdCuaLp(lp){ const k=khopKenh(lp.chuoi), n=khopNhan(lp.nhan_hang); if(!k) return [];
  return acts.filter(a=>a.bd && a.kt && a.bd<=lp.ngay_ket_thuc && a.kt>=lp.ngay_bat_dau && a.kenhId===k.id && (!n || a.nhanId===n.id)); }
const dongDau = t => String(t||'').split('\n').map(x=>x.trim()).filter(Boolean)[0]||'';
const thangCua = d => d.slice(0,7);
function themThang(ym,n){ const [y,m]=ym.split('-').map(Number); const d=new Date(Date.UTC(y,m-1+n,1)); return d.toISOString().slice(0,7); }
function tenThang(ym){ const [y,m]=ym.split('-'); return 'T'+Number(m)+'/'+y; }
const LOAI_LP = {onpost:'Onpost', offpost:'Offpost', '':'Không ghi'};
function renderLichPost(){
  const t=todayStr();
  if(!lichPost.length) return `<section class="card"><div class="card-h"><h2>Lịch post</h2><p>Lịch CTKM theo siêu thị, lấy từ Google Sheet kế hoạch</p></div><div class="empty">Chưa có dữ liệu lịch post. Lịch được đồng bộ tự động từ Google Sheet bằng script Google (xem README, mục “Lịch post”).</div></section>`;
  const L=lichLoc;
  const dsChuoi=[...new Set(lichPost.map(x=>x.chuoi).filter(Boolean))];
  const dsNhan=[...new Set(lichPost.map(x=>x.nhan_hang).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'vi'));
  const thangMin=thangCua(lichPost.reduce((m,x)=>x.ngay_bat_dau<m?x.ngay_bat_dau:m,'9999-12-31')), thangMax=thangCua(lichPost.reduce((m,x)=>x.ngay_ket_thuc>m?x.ngay_ket_thuc:m,'0000-01-01'));
  const dsThang=[]; for(let m=thangMin; m<=thangMax && dsThang.length<60; m=themThang(m,1)) dsThang.push(m);
  if(!L.tu || !dsThang.includes(L.tu)) L.tu = dsThang.includes(thangCua(t)) ? thangCua(t) : dsThang[0];
  const so=Math.max(1,Number(L.soThang)||3);
  const dau=L.tu+'-01', cuoi=addDays(themThang(L.tu,so)+'-01',-1), tongNgay=diff(dau,cuoi)+1;
  const pct=d=>(diff(dau,d)/tongNgay*100);
  const loc=lichPost.filter(x=>(!L.chuoi||x.chuoi===L.chuoi)&&(!L.nhan||x.nhan_hang===L.nhan)&&(!L.loai||x.loai===(L.loai==='khong'?'':L.loai)));
  const trongKhung=loc.filter(x=>x.ngay_bat_dau<=cuoi && x.ngay_ket_thuc>=dau);
  // nhóm theo chuỗi > (siêu thị) > nhãn; xếp các chương trình chồng ngày vào nhiều làn
  const nhom=new Map();
  trongKhung.forEach(x=>{ const k=x.chuoi+'|'+x.sieu_thi+'|'+x.nhan_hang; (nhom.get(k)||nhom.set(k,[]).get(k)).push(x); });
  const thuTuChuoi=c=>dsChuoi.indexOf(c);
  const hang=[...nhom.entries()].sort((a,b)=>thuTuChuoi(a[1][0].chuoi)-thuTuChuoi(b[1][0].chuoi) || a[1][0].dong-b[1][0].dong);
  const thangs=[]; for(let m=L.tu,i=0;i<so;i++,m=themThang(m,1)) thangs.push(m);
  const nenThang=thangs.map((m,i)=>i?`<div class="g-sep" style="left:${pct(m+'-01')}%"></div>`:'').join('');
  const homNay=(t>=dau&&t<=cuoi)?`<div class="g-today" style="left:${pct(t)}%" title="Hôm nay"></div>`:'';
  let chuoiTruoc='';
  const rows=hang.map(([k,ds])=>{
    ds.sort((a,b)=>a.ngay_bat_dau.localeCompare(b.ngay_bat_dau)); const lan=[];
    const bars=ds.map(x=>{ let l=lan.findIndex(e=>e<x.ngay_bat_dau); if(l<0){ l=lan.length; lan.push(''); } lan[l]=x.ngay_ket_thuc;
      const bd=x.ngay_bat_dau<dau?dau:x.ngay_bat_dau, kt=x.ngay_ket_thuc>cuoi?cuoi:x.ngay_ket_thuc;
      const co=hdCuaLp(x).length>0;
      return `<button type="button" class="g-bar ${x.loai==='onpost'?'on':x.loai==='offpost'?'off':''} ${co?'co':''}" data-lp="${x.id}" style="left:${pct(bd)}%;width:calc(${(diff(bd,kt)+1)/tongNgay*100}% - 2px);top:${5+l*28}px" title="${esc(fd(x.ngay_bat_dau)+' – '+fd(x.ngay_ket_thuc)+'\n'+x.noi_dung)}">${co?'✓ ':''}${esc(dongDau(x.noi_dung))}</button>`; }).join('');
    const x0=ds[0]; const dauChuoi=x0.chuoi!==chuoiTruoc; chuoiTruoc=x0.chuoi;
    return `<div class="g-row"><div class="g-lab ${dauChuoi?'chuoi-dau':''}">${dauChuoi?`<b>${esc(x0.chuoi||'—')}</b>`:''}${esc([x0.nhan_hang, /all\s*stores?/i.test(x0.sieu_thi)?'':x0.sieu_thi].filter(Boolean).join(' · ')||'—')}</div><div class="g-track" style="height:${10+lan.length*28}px">${nenThang}${homNay}${bars}</div></div>`; }).join('');
  const sapToi=loc.filter(x=>x.ngay_bat_dau>=t && x.ngay_bat_dau<=addDays(t,45)).sort((a,b)=>a.ngay_bat_dau.localeCompare(b.ngay_bat_dau));
  const opt=(arr,sel,blank)=>`<option value="">${blank}</option>`+arr.map(v=>`<option value="${esc(v)}" ${v===sel?'selected':''}>${esc(v)}</option>`).join('');
  return `<section class="card"><div class="card-h"><div><h2>Lịch post</h2><p>${dongBoLich?`Đồng bộ lần cuối ${new Date(dongBoLich.luc).toLocaleString('vi-VN')} từ “${esc(dongBoLich.nguon)}” · ${dongBoLich.so_dong} chương trình.`:''} Muốn sửa lịch thì sửa trên Google Sheet.</p></div></div>
    <div class="filters">
      <select id="lpChuoi" aria-label="Lọc chuỗi">${opt(dsChuoi,L.chuoi,'Tất cả chuỗi')}</select>
      <select id="lpNhan" aria-label="Lọc nhãn hàng">${opt(dsNhan,L.nhan,'Tất cả nhãn')}</select>
      <select id="lpLoai" aria-label="Lọc loại"><option value="">Onpost và offpost</option><option value="onpost" ${L.loai==='onpost'?'selected':''}>Chỉ Onpost</option><option value="offpost" ${L.loai==='offpost'?'selected':''}>Chỉ Offpost</option><option value="khong" ${L.loai==='khong'?'selected':''}>Không ghi loại</option></select>
      <select id="lpTu" aria-label="Từ tháng">${dsThang.map(m=>`<option value="${m}" ${m===L.tu?'selected':''}>Từ ${tenThang(m)}</option>`).join('')}</select>
      <select id="lpSo" aria-label="Số tháng hiển thị">${[1,2,3,6,12].map(n=>`<option value="${n}" ${String(n)===String(L.soThang)?'selected':''}>${n} tháng</option>`).join('')}</select>
    </div>
    <div class="g-legend"><span><i style="background:var(--info-soft)"></i>Onpost</span><span><i style="background:var(--warn-soft)"></i>Offpost</span><span><i style="background:var(--soft);border:1px solid var(--line)"></i>Không ghi loại</span><span><i style="box-shadow:inset 0 0 0 2px var(--ok)"></i>✓ đã có hoạt động trong app</span><span><i style="background:var(--bad);opacity:.55;width:3px"></i>Hôm nay</span><span>Bấm vào một thanh để xem chi tiết${laKhach()?'':' và tạo hoạt động CTKM'}.</span></div>
    ${rows?`<div class="scroll"><div class="gantt"><div class="g-row head"><div class="g-lab"><b>Chuỗi · nhãn</b></div><div class="g-track" style="min-height:30px">${thangs.map((m,i)=>`<div class="g-mon" style="left:${pct(m+'-01')}%;width:${(diff(m+'-01',addDays(themThang(m,1)+'-01',-1))+1)/tongNgay*100}%">${tenThang(m)}</div>`).join('')}${homNay}</div></div>${rows}</div></div>`:'<div class="empty">Không có chương trình nào trong khoảng này.</div>'}
  </section>
  <section class="card"><div class="card-h"><h2>Sắp bắt đầu (45 ngày tới)</h2><p>${sapToi.length} chương trình · cột “Hoạt động” cho biết đã tạo CTKM trong app chưa</p></div>${sapToi.length?`<div class="scroll"><table><thead><tr><th>Bắt đầu</th><th>Chuỗi</th><th>Nhãn</th><th>Loại</th><th>Nội dung</th><th>Hoạt động trong app</th></tr></thead><tbody>${
    sapToi.map(x=>{ const hd=hdCuaLp(x); return `<tr><td class="num">${fd(x.ngay_bat_dau)}<div class="sub">đến ${fd(x.ngay_ket_thuc)}</div></td><td>${esc(x.chuoi)}</td><td>${esc(x.nhan_hang||'—')}</td><td>${LOAI_LP[x.loai]}</td><td><button type="button" class="link" data-lp="${x.id}">${esc(dongDau(x.noi_dung))}</button></td><td>${hd.length?hd.map(a=>`<button type="button" class="link" data-open="${esc(a.id)}">${esc(a.ten)}</button>`).join('<br>'):`<button class="btn sm" data-tao-lp="${x.id}" type="button">Tạo CTKM</button>`}</td></tr>`; }).join('')
  }</tbody></table></div>`:'<div class="empty">Không có chương trình nào sắp bắt đầu.</div>'}</section>`;
}
function moLp(id){ const x=lichPost.find(v=>String(v.id)===String(id)); if(!x) return; modal={type:'lp', d:{id:x.id}}; renderModal(); }
function taoTuLp(id){
  const x=lichPost.find(v=>String(v.id)===String(id)); if(!x) return;
  const k=khopKenh(x.chuoi), n=khopNhan(x.nhan_hang);
  const tp=templates.find(tp=>x.loai==='onpost'?/onpost/i.test(tp.ten):/offpost/i.test(tp.ten)) || templates.find(tp=>/ctkm/i.test(tp.ten)) || templates[0];
  openNew();

  ${ql?`<div class="addrow"><input id="mTen" placeholder="Họ tên" aria-label="Họ tên thành viên mới"><input id="mEmail" type="email" placeholder="Email đăng nhập" aria-label="Email thành viên mới"><select id="mRole" aria-label="Vai trò"><option value="thanh_vien">Thành viên</option><option value="quan_ly">Quản lý</option><option value="khach">Khách (chỉ xem)</option></select><button class="btn pri" data-act="them-tv" type="button">Thêm thành viên</button></div>
  <p class="hint" style="padding:0 16px 14px">Sau khi được thêm, người đó mở link app, chọn “Tạo tài khoản” bằng đúng email này.<br><b>Khách (chỉ xem)</b>: xem được tổng quan, hoạt động, lịch việc, quy trình mẫu; không sửa, thêm, xóa được gì và không thấy danh sách thành viên. Khách không có trong danh sách chọn người làm.</p>`:''}

/* Tên người làm gõ tay từ trước, không khớp với thành viên nào: cho quản lý gộp về đúng thành viên */
function tenNgoaiDanhSach(){
  const dem=new Map();
  allSteps().forEach(({s})=>{ const k=khoaTen(s.nguoi); if(!k || laThanhVien(k)) return;
    const o=dem.get(k)||{ten:tenNguoi(s.nguoi), so:0, cachViet:new Set()}; o.so++; o.cachViet.add(s.nguoi); dem.set(k,o); });
  return [...dem.entries()].sort((a,b)=>a[1].ten.localeCompare(b[1].ten,'vi'));
}
function renderGopTen(){
  const ds=tenNgoaiDanhSach(); if(!ds.length) return '';
  const tv=tenThanhVien();
  return `<section class="card"><div class="card-h"><h2>Tên người làm chưa khớp thành viên</h2><p>Các tên được gõ tay trước đây. Chọn đúng thành viên rồi bấm “Gộp” để mọi bước mang tên đó chuyển sang thành viên này.</p></div>
  <div class="scroll"><table><thead><tr><th>Tên đang ghi</th><th class="num">Số bước</th><th>Gộp vào thành viên</th><th></th></tr></thead><tbody>${
    ds.map(([k,o],j)=>`<tr><td>${esc(o.ten)}${o.cachViet.size>1?`<div class="sub">${o.cachViet.size} cách viết: ${[...o.cachViet].map(esc).join(', ')}</div>`:''}</td><td class="num">${o.so}</td>
      <td><select id="gop${j}" aria-label="Thành viên để gộp tên ${esc(o.ten)}"><option value="">Chọn thành viên</option>${tv.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}</select></td>
      <td style="text-align:right"><button class="btn sm" data-gop="${j}" type="button">Gộp</button></td></tr>`).join('')
  }</tbody></table></div>${tv.length?'':'<p class="hint" style="padding:0 16px 14px">Chưa có thành viên nào để gộp vào. Hãy thêm thành viên ở bảng trên trước.</p>'}</section>`;
}
function gopTen(j){
  const muc=tenNgoaiDanhSach()[j]; if(!muc) return;
  const [,o]=muc; const dich=document.getElementById('gop'+j)?.value;
  if(!dich) return toast('Hãy chọn thành viên để gộp vào.');
  askConfirm('Gộp tên người làm?', `${o.so} bước đang ghi “${o.ten}” sẽ chuyển sang “${dich}”.`, 'Gộp', ()=>{
    const cu=[...o.cachViet];
    acts.forEach(a=>(a.buoc||[]).forEach(b=>{ if(cu.includes(b.nguoi)) b.nguoi=dich; })); render();
    run('gop', async()=>{ for(const c of cu) must(await sb.from('buoc_cong_viec').update({nguoi_lam:dich}).eq('nguoi_lam',c)); toast(`Đã gộp ${o.so} bước vào ${dich}`); });
  });
}

function renderAuth(){
  authed=false; setChrome();
  const m=authMode;
  const title={login:'Đăng nhập',signup:'Tạo tài khoản',forgot:'Quên mật khẩu',reset:'Đặt mật khẩu mới'}[m];
  main.innerHTML=`<form class="auth" id="authForm" novalidate>
    <h2>${title}</h2>
    ${m!=='reset'?`<div class="field"><label for="aEmail">Email</label><input id="aEmail" type="email" autocomplete="email" required></div>`:''}
    ${m!=='forgot'?`<div class="field"><label for="aPass">${m==='reset'?'Mật khẩu mới':'Mật khẩu'}</label><input id="aPass" type="password" autocomplete="${m==='login'?'current-password':'new-password'}" minlength="6" required></div>`:''}
    ${authMsg.err?`<p class="err">${esc(authMsg.err)}</p>`:''}${authMsg.ok?`<p class="ok-msg">${esc(authMsg.ok)}</p>`:''}
    <button class="btn pri" type="submit">${{login:'Đăng nhập',signup:'Tạo tài khoản',forgot:'Gửi email đặt lại mật khẩu',reset:'Lưu mật khẩu mới'}[m]}</button>
    <div class="row">${m==='login'?`<button class="link" type="button" data-auth="signup">Tạo tài khoản mới</button><button class="link" type="button" data-auth="forgot">Quên mật khẩu?</button>`:(m==='reset'?'':`<button class="link" type="button" data-auth="login">← Quay lại đăng nhập</button>`)}</div>
    ${m==='signup'?'<p class="hint">Chỉ email đã được quản lý thêm vào danh sách thành viên mới xem được dữ liệu.</p>':''}
  </form>`;
}
main.addEventListener('submit', async e=>{
  if(e.target.id!=='authForm') return; e.preventDefault();
  const email=(document.getElementById('aEmail')?.value||'').trim().toLowerCase(); const pass=document.getElementById('aPass')?.value||'';
  authMsg={err:'',ok:''};
  if(authMode!=='reset' && !email){ authMsg.err='Hãy nhập email.'; return renderAuth(); }
  if(authMode!=='forgot' && pass.length<6){ authMsg.err='Mật khẩu cần ít nhất 6 ký tự.'; return renderAuth(); }
  const btn=e.target.querySelector('button[type=submit]'); btn.disabled=true;
  try{
    if(authMode==='login'){ const {error}=await sb.auth.signInWithPassword({email,password:pass}); if(error) throw error; }
    else if(authMode==='signup'){ const {data,error}=await sb.auth.signUp({email,password:pass,options:{emailRedirectTo:location.origin+location.pathname}}); if(error) throw error;
      if(!data.session){ authMode='login'; authMsg.ok='Đã tạo tài khoản. Hãy mở email để xác nhận, rồi quay lại đăng nhập.'; } }
    else if(authMode==='forgot'){ const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname}); if(error) throw error; authMsg.ok='Đã gửi email. Bấm vào link trong email để đặt mật khẩu mới.'; }
    else if(authMode==='reset'){ const {error}=await sb.auth.updateUser({password:pass}); if(error) throw error; authMode='login'; toast('Đã đổi mật khẩu.'); history.replaceState(null,'',location.pathname); return afterAuth(); }
  }catch(err){
    const m=err.message||'';
    authMsg.err = /Invalid login credentials/i.test(m)?'Sai email hoặc mật khẩu.' : /Email not confirmed/i.test(m)?'Email chưa được xác nhận. Hãy mở email xác nhận trước.' : /already registered/i.test(m)?'Email này đã có tài khoản, hãy đăng nhập.' : /rate limit/i.test(m)?'Gửi email quá nhiều lần, hãy thử lại sau ít phút.' : m;
  }
  if(!session || authMode==='forgot') renderAuth();
});
main.addEventListener('click', e=>{ const b=e.target.closest('[data-auth]'); if(b){ authMode=b.dataset.auth; authMsg={err:'',ok:''}; renderAuth(); } });
document.getElementById('who').addEventListener('click', async e=>{ if(e.target.closest('[data-act="dang-xuat"]')){ await sb.auth.signOut(); } });

  if(el.id==='eRe'){ modal.d.re=el.checked; return; }
  if(el.dataset.tf){ modal.d.buoc[+el.dataset.ti][el.dataset.tf]= el.dataset.tf==='soNgay'? Number(el.value||0) : el.value; return; }
  if(el.dataset.role!=null){ modal.d.roles[el.dataset.role]=el.value; if(modal.type==='new') rerenderKeepScroll(); return; }
  if(el.dataset.n){ modal.d[el.dataset.n]=el.value;
    if(modal.type==='new'){ if(el.dataset.n==='tplId'){ const tp=templates.find(x=>x.id===el.value); if(tp && !modal.d.tenSua) modal.d.ten=tp.ten; } if(el.dataset.n==='ten') modal.d.tenSua=true; rerenderKeepScroll(); }
  }
});
function rerenderKeepScroll(){ const bg=modalEl.querySelector('.backdrop'); const st=bg?bg.scrollTop:0; renderModal(); const nb=modalEl.querySelector('.backdrop'); if(nb) nb.scrollTop=st; }
modalEl.addEventListener('click', e=>{
  const t=e.target.closest('[data-m],[data-tmove],[data-tdel]'); if(!t||!modal) return;
  if(t.dataset.tmove){ const [i,dir]=t.dataset.tmove.split(':').map(Number); const j=i+dir; const b=modal.d.buoc; if(j<0||j>=b.length) return; [b[i],b[j]]=[b[j],b[i]]; rerenderKeepScroll(); return; }
  if(t.dataset.tdel!=null){ modal.d.buoc.splice(+t.dataset.tdel,1); rerenderKeepScroll(); return; }
  const m=t.dataset.m;
  if(m==='bg'){ if(e.target===t) closeModal(); return; }
  if(m==='close') return closeModal();
  if(m==='yes'){ const fn=modal.fn; closeModal(); fn&&fn(); return; }
  if(m==='create') return createAct();
  if(m==='save-edit') return saveEdit();
  if(m==='tadd'){ modal.d.buoc.push({ten:'',vaiTro:'Trade MKT',moc:'bd',soNgay:0,ketQua:'',nguoiLam:'',nguoiDuyet:''}); rerenderKeepScroll(); return; }
  if(m==='tsave') return saveTpl();
  if(m==='tralai-ok') return traLai();
  if(m==='tao-lp'){ const id=modal.d.id; closeModal(); if(!laKhach()) taoTuLp(id); return; }
  if(m==='mo-hd'){ const id=t.dataset.id; closeModal(); selectedId=id; view='hoat-dong'; location.hash='hoat-dong'; render(); return; }
  if(m==='tdelete'){ const id=modal.d.id; askConfirm('Xóa quy trình mẫu?','Các hoạt động đã tạo từ mẫu này vẫn giữ nguyên.','Xóa',()=>{ templates=templates.filter(x=>x.id!==id); render(); run('qt'+id,()=>sb.from('quy_trinh').delete().eq('id',id)); }); return; }
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && modal) closeModal(); });

/* ---------- tạo / sửa ---------- */
function openNew(){
  const tp=templates[0];
  modal={type:'new', d:{tplId:tp?tp.id:'', ten:tp?tp.ten:'', nhan:NH[0]?String(NH[0].id):'', kenh:HT[0]?String(HT[0].id):'', bd:addDays(todayStr(),30), kt:addDays(todayStr(),44), roles:{}, tenSua:false}};
  renderModal(); setTimeout(()=>document.getElementById('nTen')?.focus(),0);
}
function createAct(){
  const d=modal.d; if(!d.ten.trim()) return toast('Hãy nhập tên hoạt động.');
  if(!d.bd||!d.kt) return toast('Hãy chọn ngày bắt đầu và ngày kết thúc.');
  if(d.kt<d.bd) return toast('Ngày kết thúc phải sau ngày bắt đầu.');
  const tp=templates.find(x=>x.id===d.tplId);
  const row={ten:d.ten.trim(), quy_trinh_id:tp?.id||null, quy_trinh_ten:tp?.ten||'', nhan_hang_id:d.nhan?Number(d.nhan):null, he_thong_id:d.kenh?Number(d.kenh):null, ngay_bat_dau:d.bd, ngay_ket_thuc:d.kt};
  const steps=(tp?.buoc||[]).map((b,i)=>({thu_tu:i+1, ten:b.ten, vai_tro:b.vaiTro||'', nguoi_lam:(d.roles[b.vaiTro||'Khác']||b.nguoiLam||'').trim(), nguoi_duyet:(b.nguoiDuyet||'').trim(), moc:MOC_DB[b.moc||'bd'], so_ngay:Number(b.soNgay||0), han:addDays(b.moc==='kt'?d.kt:d.bd,b.soNgay)||null, ket_qua:b.ketQua||''}));
  closeModal(); toast('Đang tạo hoạt động…');
  run('tao-hd', async()=>{
    const hd=must(await sb.from('hoat_dong').insert(row).select('id').single());
    if(steps.length) must(await sb.from('buoc_cong_viec').insert(steps.map(s=>({...s, hoat_dong_id:hd.id}))));
    selectedId=hd.id; view='hoat-dong'; if(location.hash!=='#hoat-dong') location.hash='hoat-dong';
    toast('Đã tạo: '+row.ten);
  });
}
function saveEdit(){
  const d=modal.d; const a=acts.find(x=>x.id===d.id); if(!a) return closeModal();
  if(!d.ten.trim()) return toast('Hãy nhập tên hoạt động.');
  if(!d.bd||!d.kt) return toast('Hãy chọn đủ ngày.');
  if(d.kt<d.bd) return toast('Ngày kết thúc phải sau ngày bắt đầu.');
  const row={ten:d.ten.trim(), nhan_hang_id:d.nhan?Number(d.nhan):null, he_thong_id:d.kenh?Number(d.kenh):null, ngay_bat_dau:d.bd, ngay_ket_thuc:d.kt};
  const changes = d.re ? (a.buoc||[]).filter(b=>isOpen(b) && b.moc && b.soNgay!=null).map(b=>({id:b.id, han:addDays(b.moc==='kt'?d.kt:d.bd,b.soNgay)})) : [];
  Object.assign(a,{ten:row.ten, nhanId:row.nhan_hang_id, kenhId:row.he_thong_id, nhan:nameOf(NH,row.nhan_hang_id), kenh:nameOf(HT,row.he_thong_id), bd:d.bd, kt:d.kt});
  changes.forEach(c=>{ const b=a.buoc.find(x=>x.id===c.id); if(b) b.han=c.han; });
  closeModal(); render();
  run('hd'+a.id, async()=>{
    must(await sb.from('hoat_dong').update(row).eq('id',a.id));
    for(const c of changes) must(await sb.from('buoc_cong_viec').update({han:c.han}).eq('id',c.id));
  });
}
function saveTpl(){
  const d=modal.d; if(!d.ten.trim()) return toast('Hãy nhập tên quy trình.');
  const buoc=d.buoc.filter(b=>(b.ten||'').trim());
  if(!buoc.length) return toast('Quy trình cần ít nhất một bước.');
  if(buoc.some(b=>Math.abs(Number(b.soNgay||0))>365)) return toast('Số ngày phải trong khoảng -365 đến 365.');
  const row={ten:d.ten.trim(), mo_ta:(d.moTa||'').trim(), thu_tu:d.thuTu ?? (templates.length+1)};
  const rows=buoc.map((b,i)=>({thu_tu:i+1, ten:b.ten.trim(), vai_tro:(b.vaiTro||'').trim(), moc:MOC_DB[b.moc==='kt'?'kt':'bd'], so_ngay:Number(b.soNgay||0), ket_qua:(b.ketQua||'').trim(), nguoi_lam:(b.nguoiLam||'').trim(), nguoi_duyet:(b.nguoiDuyet||'').trim()}));
  closeModal();
  run('qt'+(d.id||'moi'), async()=>{
    let id=d.id;
    if(id){ must(await sb.from('quy_trinh').update(row).eq('id',id)); must(await sb.from('quy_trinh_buoc').delete().eq('quy_trinh_id',id)); }
    else { id=must(await sb.from('quy_trinh').insert(row).select('id').single()).id; }
    must(await sb.from('quy_trinh_buoc').insert(rows.map(r=>({...r, quy_trinh_id:id}))));
    toast('Đã lưu quy trình: '+row.ten);
  });
}
function updateStep(id,i,field,val){
  const a=acts.find(x=>x.id===id); const s=a?.buoc[i]; if(!s) return;
  if((s[field]??'')===val) return;
  if(field==='ten' && !val.trim()){ toast('Tên bước không được để trống.'); return render(); }
  const patch={};
  if(field==='ten'){ s.ten=val.trim(); patch.ten=s.ten; }
  if(field==='nguoi'){ s.nguoi=val.trim(); patch.nguoi_lam=s.nguoi; }
  if(field==='nguoiDuyet'){
    if(s.nguoiDuyet && !isManager()){ toast('Chỉ quản lý mới đổi hoặc bỏ người duyệt.'); return render(); }
    s.nguoiDuyet=val.trim(); patch.nguoi_duyet=s.nguoiDuyet;
    if(!s.nguoiDuyet && s.trangThai==='cho'){ s.trangThai='dang'; patch.trang_thai='dang_lam'; }
  }
  if(field==='han'){ s.han=val; patch.han=val||null; }
  if(field==='ketQua'){ s.ketQua=val; patch.ket_qua=val; }
  if(field==='ghiChu'){ s.ghiChu=val; patch.ghi_chu=val; }
  if(field==='ngayXong'){ if(s.trangThai!=='xong') return; s.ngayXong=val||todayStr(); patch.ngay_xong=s.ngayXong; }
  if(field==='trangThai'){
    if(val==='cho' && !s.nguoiDuyet) return render();
    if(val==='xong' && s.nguoiDuyet && !coQuyenDuyet(s)) val='cho';              // người làm bấm hoàn tất -> gửi duyệt
    if(s.trangThai==='xong' && s.nguoiDuyet && val!=='xong' && !coQuyenDuyet(s)){ toast('Bước đã được duyệt. Chỉ người duyệt hoặc quản lý mới mở lại được.'); return render(); }
    if(s.trangThai===val) return render();
    const daDuyet = val==='xong' && !!s.nguoiDuyet;
    s.trangThai=val; patch.trang_thai=TT_DB[val];
    if(val==='xong'){ if(!s.ngayXong) s.ngayXong=todayStr(); } else s.ngayXong=''; patch.ngay_xong=s.ngayXong||null;
    if(val==='cho'){ s.ngayNop=todayStr(); patch.ngay_nop=s.ngayNop; }
    if(daDuyet){ s.lyDoTra=''; patch.ly_do_tra=''; }
  }
  render();
  run('b'+s.id, ()=>sb.from('buoc_cong_viec').update(patch).eq('id',s.id));
  if(field==='trangThai' && s.trangThai==='xong') toast((s.nguoiDuyet?'Đã duyệt: ':'Đã đánh dấu xong: ')+s.ten);
  if(field==='trangThai' && s.trangThai==='cho') toast(`Đã gửi ${tenNguoi(s.nguoiDuyet)} duyệt: ${s.ten}`);
}
function moTraLai(id,i){
  const a=acts.find(x=>x.id===id); const s=a?.buoc[i]; if(!s) return;
  modal={type:'tralai', d:{id, i, ten:s.ten, nguoi:tenNguoi(s.nguoi)||'người làm', lyDo:''}}; renderModal();
  setTimeout(()=>document.getElementById('trLyDo')?.focus(),0);
}
function traLai(){
  const d=modal.d; const lyDo=(d.lyDo||'').trim(); if(!lyDo) return toast('Hãy ghi lý do trả lại để người làm biết cần sửa gì.');
  const a=acts.find(x=>x.id===d.id); const s=a?.buoc[d.i]; closeModal(); if(!s) return;
  const ghi=`${lyDo} (${me()?.ho_ten||myEmail()}, ${fd(todayStr())})`;
  s.trangThai='dang'; s.ngayXong=''; s.lyDoTra=ghi; render();
  run('b'+s.id, ()=>sb.from('buoc_cong_viec').update({trang_thai:'dang_lam', ngay_xong:null, ly_do_tra:ghi}).eq('id',s.id));
  toast('Đã trả lại: '+s.ten);
}

/* ---------- xử lý trên trang ---------- */
document.getElementById('btnNew').addEventListener('click', ()=>{ if(!laKhach()) openNew(); });
main.addEventListener('click', e=>{
  if(!authed) return;
  const t=e.target.closest('[data-lp],[data-tao-lp],[data-open],[data-done],[data-duyet],[data-tralai],[data-act],[data-delstep],[data-sua-qt],[data-del-member],[data-gop],[data-pnav],[data-person]'); if(!t) return;
  if(laKhach() && t.matches(NUT_SUA)) return toast('Bạn đang xem với quyền khách nên không sửa được.');
  if(t.dataset.lp!=null) return moLp(t.dataset.lp);
  if(t.dataset.taoLp!=null) return taoTuLp(t.dataset.taoLp);
  if(t.dataset.pnav!=null){ const w=+t.dataset.pnav; period.off = w===0?0:period.off+w; return render(); }
  if(t.dataset.person!=null){ calPerson=t.dataset.person==='Chưa giao'?'__none':t.dataset.person; selectedId=null; location.hash='lich-viec'; return; }
  if(t.dataset.duyet){ e.stopPropagation(); const [id,i]=t.dataset.duyet.split(':'); return updateStep(id,+i,'trangThai','xong'); }
  if(t.dataset.tralai){ e.stopPropagation(); const [id,i]=t.dataset.tralai.split(':'); return moTraLai(id,+i); }
  if(t.dataset.done){ e.stopPropagation(); const [id,i]=t.dataset.done.split(':'); return updateStep(id,+i,'trangThai','xong'); }
  if(t.dataset.open){ selectedId=t.dataset.open; view='hoat-dong'; if(location.hash!=='#hoat-dong') location.hash='hoat-dong'; render(); window.scrollTo(0,0); return; }
  if(t.dataset.gop!=null) return gopTen(+t.dataset.gop);
  if(t.dataset.delMember){ const em=t.dataset.delMember; return askConfirm('Xóa thành viên?', `${em} sẽ không còn xem và sửa được dữ liệu.`, 'Xóa', ()=>run('tv'+em,()=>sb.from('thanh_vien').delete().eq('email',em))); }
  if(t.dataset.delstep!=null){ const i=+t.dataset.delstep; const a=acts.find(x=>x.id===selectedId); if(!a) return; const s=a.buoc[i];
    return askConfirm('Xóa bước này?', `“${s.ten}” sẽ bị xóa khỏi hoạt động.`, 'Xóa', ()=>{ a.buoc.splice(i,1); render(); run('b'+s.id,()=>sb.from('buoc_cong_viec').delete().eq('id',s.id)); }); }
  if(t.dataset.suaQt){ const tp=templates.find(x=>x.id===t.dataset.suaQt); modal={type:'tpl', d:Object.assign({moTa:''},clone(tp))}; return renderModal(); }
  const act=t.dataset.act; const a=acts.find(x=>x.id===selectedId);
  if(act==='back'){ selectedId=null; if(location.hash!=='#hoat-dong') history.replaceState(null,'','#hoat-dong'); render(); }
  if(act==='them-buoc' && a){ const tt=Math.max(0,...(a.buoc||[]).map(b=>b.thuTu||0))+1; run('hd'+a.id,()=>sb.from('buoc_cong_viec').insert({hoat_dong_id:a.id, thu_tu:tt, ten:'Bước mới', han:a.bd||null})); }
  if(act==='sua-hd' && a){ modal={type:'edit', d:{id:a.id, ten:a.ten, nhan:a.nhanId!=null?String(a.nhanId):'', kenh:a.kenhId!=null?String(a.kenhId):'', bd:a.bd, kt:a.kt, re:false}}; renderModal(); }
  if(act==='xoa-hd' && a){ askConfirm('Xóa hoạt động?', `“${a.ten}” và toàn bộ tiến độ các bước sẽ bị xóa, không khôi phục được.`, 'Xóa', ()=>{ acts=acts.filter(x=>x.id!==a.id); selectedId=null; render(); run('hd'+a.id,()=>sb.from('hoat_dong').delete().eq('id',a.id)); }); }
  if(act==='tao-qt'){ modal={type:'tpl', d:{ten:'',moTa:'',buoc:[{ten:'',vaiTro:'Trade MKT',moc:'bd',soNgay:-7,ketQua:'',nguoiLam:'',nguoiDuyet:''}]}}; renderModal(); }
  if(act==='them-tv'){ const ten=document.getElementById('mTen').value.trim(), em=document.getElementById('mEmail').value.trim().toLowerCase(), vt=document.getElementById('mRole').value;
    if(!ten||!/^\S+@\S+\.\S+$/.test(em)) return toast('Hãy nhập họ tên và email hợp lệ.');
    run('tv'+em, async()=>{ must(await sb.from('thanh_vien').insert({email:em, ho_ten:ten, vai_tro:vt})); toast('Đã thêm '+ten); }); }
});
main.addEventListener('change', e=>{
  if(!authed) return;
  const el=e.target;
  if(laKhach() && (el.dataset.f || el.dataset.roleEmail)) return render();
  if(el.dataset.f && el.dataset.i!=null && selectedId) return updateStep(selectedId,+el.dataset.i,el.dataset.f,el.value);
  if(el.dataset.roleEmail){ const em=el.dataset.roleEmail; return run('tv'+em,()=>sb.from('thanh_vien').update({vai_tro:el.value}).eq('email',em)); }
  if(el.id==='pMode'){ period.mode=el.value; period.off=0; if(el.value==='tuy-chon' && !period.tu){ const d=new Date(); period.tu=ymd(new Date(d.getFullYear(),d.getMonth(),1)); period.den=todayStr(); } return render(); }
  if(el.id==='pTu'){ period.tu=el.value; return render(); }
  if(el.id==='pDen'){ period.den=el.value; return render(); }
  if(el.id==='fnhan'){ filters.nhan=el.value; render(); }
  if(el.id==='fkenh'){ filters.kenh=el.value; render(); }
  if(el.id==='ftt'){ filters.tt=el.value; render(); }
  if(el.id==='fnguoi'){ calPerson=el.value; render(); }
  if(el.id==='lpChuoi'){ lichLoc.chuoi=el.value; render(); }
  if(el.id==='lpNhan'){ lichLoc.nhan=el.value; render(); }
  if(el.id==='lpLoai'){ lichLoc.loai=el.value; render(); }
  if(el.id==='lpTu'){ lichLoc.tu=el.value; render(); }
  if(el.id==='lpSo'){ lichLoc.soThang=el.value; render(); }
});
main.addEventListener('input', e=>{ if(e.target.id==='fq'){ filters.q=e.target.value; clearTimeout(main._q); main._q=setTimeout(()=>{ const pos=e.target.selectionStart; render(); const f=document.getElementById('fq'); if(f){ f.focus(); try{f.setSelectionRange(pos,pos);}catch(_){} } },250); } });

/* ---------- điều hướng ---------- */
function readHash(){ const [h,id]=location.hash.replace('#','').split('/'); view=VIEWS.includes(h)?h:'tong-quan'; if(view==='hoat-dong' && id) selectedId=decodeURIComponent(id); } // #hoat-dong/<mã> mở thẳng 1 hoạt động (dùng cho link trong email nhắc hạn)
window.addEventListener('hashchange', ()=>{ readHash(); if(view!=='hoat-dong') selectedId=null; render(); });
document.getElementById('nav').addEventListener('click', e=>{ const a=e.target.closest('a'); if(!a) return; if(a.dataset.v==='hoat-dong' && location.hash==='#hoat-dong'){ selectedId=null; render(); } else selectedId=null; });
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && authed) scheduleReload(); });

/* ---------- khởi động ---------- */
async function afterAuth(){
  if(channel){ sb.removeChannel(channel); channel=null; }
  authed=false; loaded=false; members=[];
  if(!session){ renderAuth(); return; }
  if(authMode==='reset'){ renderAuth(); return; }
  let {data:ok,error}=await sb.rpc('duoc_xem');
  if(error && /duoc_xem/.test(errText(error))) ({data:ok,error}=await sb.rpc('la_thanh_vien')); // cơ sở dữ liệu chưa cập nhật bản có vai trò khách
  if(error){ main.innerHTML=`<div class="auth"><h2>Chưa kết nối được</h2><p class="err">${esc(errText(error))}</p><p class="hint">Kiểm tra đã chạy file thiết kế cơ sở dữ liệu trong Supabase chưa.</p></div>`; setChrome(); return; }
  if(!ok){ setChrome(); main.innerHTML=`<div class="auth"><h2>Chưa có quyền truy cập</h2><p>Email <b>${esc(myEmail())}</b> chưa có trong danh sách thành viên.</p><p class="hint">Nhờ quản lý vào mục “Thành viên” thêm email này, rồi tải lại trang.</p></div>`; return; }
  authed=true; readHash(); render();
  await loadAll();
  channel=sb.channel('thay-doi').on('postgres_changes',{event:'*',schema:'public'},()=>scheduleReload()).subscribe();
}
(async function init(){
  if(!CFG.url || /DIEN_/.test(CFG.url) || !CFG.khoa || /DIEN_/.test(CFG.khoa)){
    main.innerHTML=`<div class="auth"><h2>Chưa cấu hình</h2><p>Hãy mở file <b>cau-hinh.js</b> và điền <b>Project URL</b> cùng <b>khóa công khai</b> của Supabase.</p></div>`; return;
  }
  if(!window.supabase){ main.innerHTML=`<div class="auth"><h2>Không tải được thư viện</h2><p class="hint">Kiểm tra kết nối mạng rồi tải lại trang.</p></div>`; return; }
  sb=window.supabase.createClient(CFG.url, CFG.khoa);
  sb.auth.onAuthStateChange((ev,s)=>{
    const changed=(s?.user?.id)!==(session?.user?.id); session=s;
    if(ev==='PASSWORD_RECOVERY'){ authMode='reset'; setTimeout(renderAuth,0); return; }
    if(changed && ev!=='INITIAL_SESSION') setTimeout(afterAuth,0);
  });
  const {data}=await sb.auth.getSession(); session=data.session;
  afterAuth();
})();
</script>
