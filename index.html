<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2c6a4c">
<title>Quản lý công việc Trade MKT</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Serif:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Bố cục: thanh trên cố định + vùng nội dung một cột, bảng là trung tâm */
  --bg:#f3f5f2; --surface:#ffffff; --ink:#1c2621; --muted:#5d6a63; --line:#dde3dc; --soft:#eaf0ea;
  --accent:#2c6a4c; --accent-ink:#ffffff; --accent-soft:#e1efe6;
  --ok:#23804f; --ok-soft:#e1f2e8; --warn:#a86d00; --warn-soft:#fbf0d9; --bad:#b9381f; --bad-soft:#fbe5df; --info:#2a5f8f; --info-soft:#e2edf7;
  --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --font-tieu-de:"Noto Serif",Georgia,"Times New Roman",serif;   /* tiêu đề kiểu báo chí, dùng chung với Trang báo cáo */
  --br-wil:#3d9a5b; --br-gungon:#2f7cb8; --br-guyumi:#d64545; --br-mabay:#e0823d;   /* màu 4 brand, dùng ở mọi nơi */
  --r:10px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121815; --surface:#1a221e; --ink:#e6ece8; --muted:#9aa8a0; --line:#2c3732; --soft:#202a25;
    --accent:#6dbb92; --accent-ink:#0e1612; --accent-soft:#1f3529;
    --ok:#6cc595; --ok-soft:#1c3226; --warn:#e2b04f; --warn-soft:#352b17; --bad:#f08a72; --bad-soft:#3a201a; --info:#7fb2e0; --info-soft:#1b2b3a;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121815; --surface:#1a221e; --ink:#e6ece8; --muted:#9aa8a0; --line:#2c3732; --soft:#202a25;
  --accent:#6dbb92; --accent-ink:#0e1612; --accent-soft:#1f3529;
  --ok:#6cc595; --ok-soft:#1c3226; --warn:#e2b04f; --warn-soft:#352b17; --bad:#f08a72; --bad-soft:#3a201a; --info:#7fb2e0; --info-soft:#1b2b3a;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{text-wrap:balance;margin:0}
.card-h h2,.auth h2,.dialog header h2{font-family:var(--font-tieu-de);font-weight:700;letter-spacing:-.005em}
.br{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}.br i{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
/* ===== 4 ô số lớn (Tổng quan) ===== */
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px}
.kpi a.o{display:flex;flex-direction:column;gap:4px;padding:16px 18px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);color:inherit;text-decoration:none;position:relative;overflow:hidden;transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease}
.kpi a.o:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,0,0,.08);border-color:var(--accent)}
.kpi a.o::before{content:"";position:absolute;inset:0 auto 0 0;width:4px;background:var(--mau-o,var(--accent))}
.kpi .nhan{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.kpi .so{font-family:var(--font-tieu-de);font-size:30px;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi .so small{font-family:var(--font);font-size:13px;font-weight:500;color:var(--muted);margin-left:4px}
.kpi .tren{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;min-height:38px}
.kpi .phu{font-size:12.5px;color:var(--muted);line-height:1.35}
.kpi .tang{font-weight:700;color:var(--ok)}.kpi .giam{font-weight:700;color:var(--bad)}
.kpi .so{white-space:nowrap}.kpi svg.spark{flex:0 1 104px;min-width:56px;width:104px;height:34px;overflow:visible}
@media (max-width:600px){ .kpi{grid-template-columns:1fr 1fr;gap:10px} .kpi a.o{padding:12px 12px 10px} .kpi .so{font-size:22px} .kpi .so small{display:block;margin:0} .kpi svg.spark{display:none} .kpi .phu{font-size:12px} }
/* ===== Chờ tải: khung mờ đúng hình nội dung ===== */
.sk{display:grid;gap:16px}.sk .k{border-radius:12px;background:linear-gradient(90deg,var(--soft) 25%,var(--line) 37%,var(--soft) 63%);background-size:400% 100%;animation:skMo 1.3s ease infinite}
.sk .h4{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px}.sk .h4 .k{height:118px}.sk .k.cao{height:220px}.sk .k.vua{height:140px}
@keyframes skMo{0%{background-position:100% 50%}100%{background-position:0 50%}}
/* ===== Màn hình xin chào (mỗi ngày 1 lần khi mở app) ===== */
#chao{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px;overflow:hidden;
  background:radial-gradient(900px 500px at 80% -10%,var(--tuyet-anh,rgba(109,187,146,.16)),transparent 60%),radial-gradient(800px 420px at 0% 110%,var(--accent-soft),transparent 60%),var(--bg);
  transition:opacity .45s ease,visibility .45s;cursor:pointer}
#chao.tat{opacity:0;visibility:hidden}
#chao .the{position:relative;z-index:2;width:min(520px,100%);text-align:center;display:grid;gap:14px;justify-items:center;cursor:default}
#chao .logo{width:84px;height:auto;filter:drop-shadow(0 6px 14px rgba(0,0,0,.12))}
#chao .loi{font-size:15px;color:var(--muted);font-weight:500}
#chao h1{font-family:var(--font-tieu-de);font-size:clamp(30px,6vw,44px);line-height:1.12;margin:0;letter-spacing:-.01em}
#chao h1 b{color:var(--accent)}
#chao .ngay{font-size:14px;color:var(--muted)}
#chao .cau{font-size:15px;max-width:40ch;line-height:1.5}
#chao .chips{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:2px}
#chao .chips span{padding:6px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:600}
#chao .chips .do{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}
#chao .chips .cam{color:#c2410c;border-color:color-mix(in srgb,#d97706 40%,var(--line))}
#chao .chips .xanh{color:var(--ok)}
#chao button.vao{margin-top:6px;padding:11px 22px;border-radius:999px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:15px;cursor:pointer;box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 35%,transparent);transition:transform .15s ease}
#chao button.vao:hover{transform:translateY(-1px)}
#chao button.vao:focus-visible{outline:3px solid var(--accent-soft);outline-offset:3px}
#chao .goi-y{font-size:12px;color:var(--muted)}
#chao .tuyet{position:absolute;inset:0;z-index:1;pointer-events:none;overflow:hidden}#chao .tuyet i{position:absolute;top:-12px;border-radius:50%;background:var(--tuyet-hat,#cfe0ee);animation:roi linear infinite}
@media (prefers-reduced-motion:reduce){ #chao .tuyet{display:none} }
#chao .canh{position:absolute;left:0;right:0;bottom:0;height:280px;z-index:1;pointer-events:none}
#chao .canh svg{width:100%;height:100%;display:block}
#chao .canh .d1{fill:var(--tuyet1,var(--soft))}#chao .canh .d2{fill:var(--tuyet2,var(--line))}#chao .canh .d3{fill:var(--tuyet3,var(--line))}#chao .canh .cay{fill:var(--tuyet-cay,var(--accent))}#chao .canh .cay2{fill:var(--tuyet-cay2,var(--accent-soft))}
#chao .the>*{animation:chaoLen .6s cubic-bezier(.2,.7,.2,1) both}
#chao .the>*:nth-child(2){animation-delay:.08s}#chao .the>*:nth-child(3){animation-delay:.16s}#chao .the>*:nth-child(4){animation-delay:.24s}
#chao .the>*:nth-child(5){animation-delay:.32s}#chao .the>*:nth-child(6){animation-delay:.4s}#chao .the>*:nth-child(n+7){animation-delay:.48s}
#chao .logo{animation:chaoLogo .7s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes chaoLen{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes chaoLogo{from{opacity:0;transform:scale(.7) rotate(-8deg)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){ #chao .the>*,#chao .logo{animation:none} #chao{transition:none} }
/* ===== Chuyển trang mượt ===== */
main.chuyen>*{animation:hienRa .32s cubic-bezier(.2,.7,.2,1) both}
main.chuyen>*:nth-child(2){animation-delay:.04s}main.chuyen>*:nth-child(3){animation-delay:.08s}main.chuyen>*:nth-child(n+4){animation-delay:.12s}
@keyframes hienRa{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){ main.chuyen>*{animation:none} .sk .k{animation:none} .kpi a.o{transition:none} }
.num,td.n,.tile b{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{position:sticky;top:0;z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{max-width:1200px;margin:0 auto;padding:12px 20px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center}
.brand-wrap{display:flex;align-items:center;gap:10px}
.brand-logo{width:46px;height:auto;display:block;flex:none}
.auth-logo{display:block;width:120px;height:auto;margin:0 auto 10px}
.auth-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;background:var(--soft);border-radius:10px;margin-bottom:4px}
.auth-tabs>*{all:unset;box-sizing:border-box;text-align:center;padding:8px 6px;border-radius:8px;cursor:pointer;font-weight:600;color:var(--muted)}
.auth-tabs>[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.auth-tabs>*:hover{color:var(--ink)}.auth-tabs>*:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.brand{display:flex;flex-direction:column}
.brand h1{font-size:17px;font-weight:700;letter-spacing:-.01em}
.brand span{font-size:12px;color:var(--muted)}
nav{display:flex;gap:4px;flex-wrap:wrap;flex:1}
nav a{padding:7px 12px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:500}
nav a:hover{background:var(--soft);color:var(--ink)}
nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
#nav > a{display:none}   /* menu ngang cũ: đã chuyển sang thanh bên trái (thanh-ben.js); giữ khoảng trống để đẩy nút sang phải */
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}

main{max-width:1200px;margin:0 auto;padding:20px;display:grid;gap:20px}
main[hidden]{display:none}
#khungBc{padding:8px 12px 20px} #khungBc[hidden]{display:none}
.khung-bc{display:block;width:100%;min-height:600px;border:0;background:transparent}   /* Trang báo cáo (bao-cao-mt.html) mở ngay trong app */
.notice{padding:10px 14px;border-radius:var(--r);background:var(--warn-soft);color:var(--ink);border:1px solid var(--line);display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.notice.info{background:var(--info-soft)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:2px}
.tile span{color:var(--muted);font-size:13px}
.tile b{font-size:28px;font-weight:700;line-height:1.2}
.tile small{color:var(--muted);font-size:12px}
.tile.bad b{color:var(--bad)} .tile.warn b{color:var(--warn)}
section.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;padding:14px 16px;border-bottom:1px solid var(--line)}
.card-h h2{font-size:15px;font-weight:600}
.card-h p{margin:0;color:var(--muted);font-size:12.5px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;padding:8px 12px;background:var(--soft);white-space:nowrap}
td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right}
tr.click{cursor:pointer} tr.click:hover td{background:var(--soft)}
.empty{padding:22px 16px;color:var(--muted)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.info{background:var(--info-soft);color:var(--info)}
.pill.neutral{background:var(--soft);color:var(--muted)}
.prog{display:flex;align-items:center;gap:8px;min-width:140px}
.prog i{flex:1;height:7px;border-radius:9px;background:var(--soft);position:relative;overflow:hidden;display:block}
.prog i::after{content:"";position:absolute;inset:0;width:var(--w);background:var(--accent);border-radius:9px}
.prog span{font-size:12px;color:var(--muted);min-width:34px;text-align:right}
.muted{color:var(--muted)} .sub{font-size:12px;color:var(--muted)}
.late{color:var(--bad);font-weight:600}
.filters{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
.filters input,.filters select{padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.filters input{min-width:200px;flex:1}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:20px}

/* chi tiết hoạt động */
.detail-h{display:grid;gap:10px;padding:16px}
.detail-h .row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:flex-start}
.detail-h h2{font-size:19px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--soft);border-radius:6px;padding:2px 8px;font-size:12.5px;color:var(--muted)}
.steps td{padding:6px 8px}
.steps input,.steps select{width:100%;padding:5px 7px;border:1px solid transparent;border-radius:6px;background:transparent;min-width:0}
.steps input:hover,.steps select:hover{border-color:var(--line)}
.steps input:focus,.steps select:focus{border-color:var(--accent);background:var(--surface);outline:none}
.steps select{border-color:var(--line)}
.steps tr.is-late td:first-child{box-shadow:inset 3px 0 0 var(--bad)}
.steps tr.is-done td{color:var(--muted)}
.steps tr.is-done input.ten{text-decoration:line-through}
.st-chua{color:var(--muted)} .st-dang{color:var(--info)} .st-cho{color:var(--warn)} .st-xong{color:var(--ok)} .st-bo{color:var(--muted)}

.group h3{font-size:13px;padding:10px 16px;background:var(--soft);border-top:1px solid var(--line);display:flex;gap:8px;align-items:center}
.group:first-child h3{border-top:0}
.gantt{min-width:880px}
:root{--g-nhan:210px}
.g-row{display:grid;grid-template-columns:var(--g-nhan) 1fr;border-top:1px solid var(--line)}
.g-row.head{border-top:0;position:sticky;top:0;background:var(--surface);z-index:2}
.g-lab{padding:6px 10px;font-size:13px;line-height:1.3;border-right:1px solid var(--line)}
.g-lab b{display:block}
.g-lab.chuoi-dau{border-top:2px solid var(--line)}
.g-track{position:relative;min-height:34px}
.g-mon{position:absolute;top:0;bottom:0;border-left:1px solid var(--line);font-size:12px;color:var(--muted);padding:8px 0 0 4px;white-space:nowrap;overflow:hidden}
.g-sep{position:absolute;top:0;bottom:0;border-left:1px dashed var(--line)}
.g-today{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);opacity:.55;z-index:1}
.g-bar{position:absolute;height:24px;border-radius:6px;padding:0 6px;font:inherit;font-size:12px;line-height:22px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border:1px solid var(--line);cursor:pointer;text-align:left;background:var(--soft);color:var(--ink)}
.g-bar.on{background:var(--info-soft);color:var(--info);border-color:transparent}
.g-bar.off{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.g-bar.co{box-shadow:inset 0 0 0 2px var(--ok)}
.g-bar.chot{box-shadow:inset 4px 0 0 var(--accent);font-weight:600}
.g-bar.chot.co{box-shadow:inset 4px 0 0 var(--accent),inset 0 0 0 2px var(--ok)}
.pill.chot{background:var(--accent-soft);color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.g-legend i.chot-mau{background:var(--soft);box-shadow:inset 4px 0 0 var(--accent)}
.ct-chot{border:1px solid color-mix(in srgb,var(--accent) 30%,var(--line));border-radius:10px;padding:10px 12px;display:grid;gap:8px;background:color-mix(in srgb,var(--accent-soft) 35%,transparent)}
.ct-chot.chua{background:transparent;border-style:dashed;border-color:var(--line);font-size:13px}
.ct-bang td,.ct-bang th{padding:6px 10px}.ct-bang .n{text-align:right;white-space:nowrap}
.au-khung{display:grid;gap:10px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--soft)}
.au-dau{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}.au-dau .hint{margin:0}
.au-ds{display:grid;gap:8px}
.au-dong{display:grid;grid-template-columns:26px minmax(130px,1fr) minmax(180px,2fr) 150px 110px 36px;gap:8px;align-items:end;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.au-so{align-self:center;justify-self:center;width:24px;height:24px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:13px;display:grid;place-items:center}
.au-xoa{align-self:end;height:38px}
.au-them{justify-self:start}
@media (max-width:760px){ .au-dong{grid-template-columns:26px 1fr 1fr} .au-dong .au-ch{grid-column:2 / 4} .au-xoa{grid-column:3;justify-self:end} }
.gantt.nam{width:max(calc(var(--g-nhan) + (100% - var(--g-nhan)) * 12 / var(--so,3)), calc(var(--g-nhan) + 12 * 110px));min-width:0}
@media (max-width:640px){ :root{--g-nhan:112px} .g-lab{font-size:12px;padding:6px 8px} }
.gantt.nam .g-lab{position:sticky;left:0;z-index:3;background:var(--surface)}
.gantt.nam .g-row.head .g-lab{z-index:4}
.lp-cuon{cursor:grab;overscroll-behavior-x:contain}.lp-cuon.keo{cursor:grabbing;user-select:none}.lp-cuon.keo .g-bar{pointer-events:none}
.lp-nav .lp-nam{display:inline-flex;gap:4px}.lp-nav .lp-cach{width:8px}.lp-nav .lp-goi{flex-basis:100%;font-size:12px;color:var(--muted)}
.warn-t{color:var(--warn);font-weight:600}.ok-t{color:var(--ok);font-weight:600}
.dialog.pa{width:min(880px,100%)}
.pa-phan{display:grid;gap:8px;border-top:1px solid var(--line);padding-top:12px}
.pa-dau{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline}.pa-dau h3{margin:0;font-size:15px}.pa-dau .btn{margin-left:auto}
.pa-ds{display:grid;gap:6px}
.pa-sp{display:grid;grid-template-columns:minmax(180px,1.6fr) auto 110px 130px auto;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.pa-sp.xong{background:color-mix(in srgb,var(--soft) 60%,var(--surface))}
.pa-ten{font-size:13px;line-height:1.3}
.pa-nhom{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex-wrap:nowrap}

<script>
const CFG = window.CAU_HINH || {};
const TT = {chua:'Chưa làm', dang:'Đang làm', cho:'Chờ duyệt', xong:'Xong', bo:'Không áp dụng'};
const TT_DB = {chua:'chua_lam', dang:'dang_lam', cho:'cho_duyet', xong:'xong', bo:'khong_ap_dung'};
const TT_APP = {chua_lam:'chua', dang_lam:'dang', cho_duyet:'cho', xong:'xong', khong_ap_dung:'bo'};
const MOC_DB = {bd:'bat_dau', kt:'ket_thuc'}, MOC_APP = {bat_dau:'bd', ket_thuc:'kt'};
const TTHD = {chuabd:['Chưa bắt đầu','neutral'], dangchay:['Đang chạy','info'], tre:['Có việc trễ','bad'], hoanthanh:['Hoàn thành','ok']};
const VIEWS = ['han-muc','bao-cao-tuan','tong-quan','hoat-dong','lich-viec','lich-post','gia','quy-trinh','thanh-vien','bc-sell-in','bc-sell-out','bc-so-sanh','bc-baseline','bc-gia'];   // bc-*: Trang báo cáo, mở bao-cao-mt.html ngay trong app

let sb = null, session = null, members = [], NH = [], HT = [], templates = [], acts = [];
let giaBan = [], giaLoc = {ht:'', nhan:''};
let soNguon = [], soHd = {};
let canhBao = [], canhBaoCt = [], canhBaoLuc = null, canhBaoKpi = [];   // cảnh báo sụt giảm sức nhập (sell-in) / sức bán (sell-out), từ view canh_bao_ban_nhap
let lich27 = [];   // Lịch post 2027 (4 hệ thống MT), đọc từ bo_so_tinh_san
let lichPost = [], dongBoLich = null, lichLoc = {chuoi:'', nhan:'', loai:'', tt:'', tu:'', soThang:'3', nam:''};
/* Trạng thái chương trình Lịch post (bảng trang_thai_lp): Trade lên CTKM -> trình ký -> CEO duyệt -> KAM đăng ký -> siêu thị duyệt */
let ttLp = new Map();
const TT_LP = [['dang_soan','Đang soạn','neutral'],['cho_ceo','Chờ CEO duyệt','warn'],['ceo_duyet','CEO đã duyệt, chờ KAM đăng ký','info'],
  ['da_dang_ky','Đã đăng ký, chờ siêu thị duyệt','cho-st'],['st_duyet','Siêu thị đã duyệt','ok'],['st_tu_choi','Siêu thị từ chối','bad']];
const TT_LP_TEN = Object.fromEntries(TT_LP.map(([k,t])=>[k,t])), TT_LP_CLS = Object.fromEntries(TT_LP.map(([k,,c])=>[k,c]));
const khoaLp = x => [x.chuoi, x.sieu_thi, x.nhan_hang, x.loai, x.ngay_bat_dau, x.ngay_ket_thuc].map(v=>String(v||'').trim()).join('|');
const ttCua = x => ttLp.get(khoaLp(x)) || null;
/* CTKM đã chốt: file "CẬP NHẬT CTKM KÊNH MT" (bộ số ctkm_chot). Chương trình Lịch post khớp hệ thống + brand + ngày chạy NTD với file = "Đã chốt CTKM" */
let ctkmChot = [], ctkmNhom = [];
const khoaHtCt = s => { const c=boDau(s); if(c.includes('coop')) return 'coop'; if(c.includes('bigc')||/^go/.test(c)) return 'go'; if(c.includes('lotte')) return 'lotte';
  if(c.includes('emart')) return 'emart'; if(c.includes('winmart')) return 'winmart'; if(c.includes('kingfood')) return 'kingfood'; if(c.includes('bachhoa')) return 'bhx'; return c; };
function nhomCtkm(rows){
  const m=new Map();
  rows.forEach(r=>{ const k=[khoaHtCt(r.he_thong), r.ky, r.ntd_tu, r.ntd_den, boDau(r.brand)].join('|');
    if(!m.has(k)) m.set(k,{ht:r.he_thong, khoaHt:khoaHtCt(r.he_thong), ky:r.ky, po_tu:r.po_tu, po_den:r.po_den, ntd_tu:r.ntd_tu, ntd_den:r.ntd_den, brand:r.brand, khoaBr:boDau(r.brand), ghi_chu:'', sp:[]});
    const g=m.get(k); g.sp.push(r); if(r.ghi_chu && !g.ghi_chu) g.ghi_chu=r.ghi_chu; });
  return [...m.values()];
}
const ctkmCuaMemo = new Map();
function ctkmCua(x){
  const k=khoaLp(x); if(ctkmCuaMemo.has(k)) return ctkmCuaMemo.get(k);
  const ht=khoaHtCt(x.chuoi), brs=String(x.nhan_hang||'').split(/[\/,+&]/).map(boDau).filter(Boolean), bd=x.ngay_bat_dau, kt=x.ngay_ket_thuc;
  const kq=ctkmNhom.filter(g=>{ if(g.khoaHt!==ht || (brs.length && !brs.includes(g.khoaBr))) return false;
    const a=bd>g.ntd_tu?bd:g.ntd_tu, b=kt<g.ntd_den?kt:g.ntd_den; if(a>b) return false;
    const chung=diff(a,b)+1, ngan=Math.min(diff(bd,kt)+1, diff(g.ntd_tu,g.ntd_den)+1); return chung/ngan>=0.5; });
  ctkmCuaMemo.set(k,kq); return kq;
}
const chotCua = x => ctkmCua(x).length>0;
const chipChot = x => chotCua(x)?' <span class="pill chot" title="Có trong file CẬP NHẬT CTKM KÊNH MT">◆ Đã chốt CTKM</span>':'';
const pillTtLp = x => { const r=ttCua(x); return r?`<span class="pill tt-${TT_LP_CLS[r.trang_thai]}">${TT_LP_TEN[r.trang_thai]}</span>`:'<span class="pill neutral" style="opacity:.7">Chưa cập nhật</span>'; };
let lanTai = 0, loaded = false, authed = false, inflight = 0, reloadTimer = null, channel = null;
let view = 'tong-quan', selectedId = null, pendingRender = false, notice = '';
let filters = {q:'', nhan:'', kenh:'', tt:''}, calPerson = null,   // null = chưa chọn: Lịch việc tự mở việc của người đang đăng nhập
  calAudit = false;
let modal = null, authMode = 'login', authMsg = {err:'', ok:''};
const main = document.getElementById('main');

/* ---------- tiện ích ---------- */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone = o => JSON.parse(JSON.stringify(o));
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDays(s,n){ if(!s) return ''; const [y,m,d]=s.split('-').map(Number); return new Date(Date.UTC(y,m-1,d+Number(n||0))).toISOString().slice(0,10); }
function diff(a,b){ const p=a.split('-').map(Number), q=b.split('-').map(Number); return Math.round((Date.UTC(q[0],q[1]-1,q[2])-Date.UTC(p[0],p[1]-1,p[2]))/86400000); }
function fd(s){ if(!s) return '—'; const [y,m,d]=s.split('-'); return d+'/'+m+'/'+y; }

async function fetchAll(table, orderCol){
  const out=[]; const size=1000;
  for(let from=0;;from+=size){
    let q=sb.from(table).select('*');
    if(orderCol) q=q.order(orderCol);
    const {data,error}=await q.order('id').range(from,from+size-1);

  }
  return out;
}

const queues = {};
function run(key, fn){
  inflight++;
  queues[key] = (queues[key]||Promise.resolve()).then(async()=>{
    const r = await fn(); if(r && r.error) throw r.error; return r;
  }).catch(e=>{ console.error(e); toast('Không lưu được: '+errText(e)); }).finally(()=>{ inflight--; scheduleReload(); });
  return queues[key];
}

let period={mode:'tuan', off:0, tu:'', den:''};
function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function periodRange(){
  const d=new Date();
  if(period.mode==='thang'){ const a=new Date(d.getFullYear(), d.getMonth()+period.off, 1), b=new Date(d.getFullYear(), d.getMonth()+period.off+1, 0); return [ymd(a), ymd(b)]; }

  const day=(d.getDay()+6)%7; const mon=new Date(d.getFullYear(),d.getMonth(),d.getDate()-day+7*period.off); const s=ymd(mon); return [s, addDays(s,6)];
}
function periodLabel(){

}

/* 4 ô số lớn đầu trang Tổng quan: số đo được, mũi tên so với kỳ trước, đường xu hướng 7 tháng */
function sparkline(vals, mau){
  const v=vals.filter(x=>x!=null&&isFinite(x)); if(v.length<2) return '';
  const W=118,H=34,p=3, mn=Math.min(...v), mx=Math.max(...v), r=(mx-mn)||1;
  const pts=v.map((y,i)=>[p+i*(W-2*p)/(v.length-1), H-p-(y-mn)/r*(H-2*p)]);
  const d=pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
  const cuoi=pts[pts.length-1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-hidden="true"><path d="${d} L${cuoi[0].toFixed(1)} ${H} L${p} ${H} Z" fill="${mau}" opacity=".12"/><path d="${d}" fill="none" stroke="${mau}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${cuoi[0].toFixed(1)}" cy="${cuoi[1].toFixed(1)}" r="3" fill="${mau}"/></svg>`;
}

    }</tbody></table></div>`:'<div class="empty">Chưa có dữ liệu.</div>'}</section>
  <section class="card"><div class="card-h"><h2>Khâu hay bị trễ</h2><p>Đếm từ các bước đã có ngày xong và hạn</p></div>${
    sRows.length?`<div class="scroll"><table><thead><tr><th>Khâu</th><th class="n">Xong muộn</th><th class="n">Muộn TB</th><th class="n">Đang trễ</th></tr></thead><tbody>${

    }</tbody></table></div>`:'<div class="empty">Chưa có khâu nào bị trễ.</div>'}</section>
  </div>`;
  return h;
}

  const so1=v=>v==null?'–':(+v).toLocaleString('vi-VN',{maximumFractionDigits:1});
  const so0=v=>v==null?'–':Math.round(+v).toLocaleString('vi-VN');

  const ds=(loai,min)=>canhBao.filter(r=>r.loai===loai && r.thay_doi!=null && +r.thay_doi<=CB_GIAM && +r.truoc>=min).sort((a,b)=>a.thay_doi-b.thay_doi);
  const si=ds('sell_in',CB_SI_TOI_THIEU), so=ds('sell_out',CB_SO_TOI_THIEU);
  const r0=canhBao.find(r=>r.loai==='sell_in'), r1=canhBao.find(r=>r.loai==='sell_out');
  const ky=r=>r?`${ngan(r.tu_ngay)}–${ngan(r.den_ngay)}`:'', kyT=r=>r&&r.tu_truoc?`${ngan(r.tu_truoc)}–${ngan(r.den_truoc)}`:'';

    return `<details class="cb-dong"><summary><span class="pill ${cls}">${md}</span><b>${esc(r.chuoi)} · ${brTag(r.nhan_hang)}</b><span class="cb-so">${tien(+r.nay)} <span class="muted">so với ${tien(+r.truoc)}</span></span><span class="cb-pt">${pt(+r.thay_doi)}</span><span class="muted cb-cl">${tien(+r.nay-+r.truoc)}</span></summary>

  };

const PA_POSM = [['co_posm','Có POSM của TVP tại kệ'],['dung_ct','POSM / bảng giá đúng chương trình đang chạy'],['diem_phu','Có điểm trưng bày phụ (đầu kệ, ụ, kệ riêng)']];

async function taiSpAudit(){
  const d=modal.d, tu=addDays(todayStr(),-120);
  try{
    let rows=[], nguon='';
    if(d.ch){ rows=await layHet(()=>sb.from('nguon_sellin_ch').select('ma_hang,ten_hang,brand').eq('diem_nhan',d.ch).gte('ngay',tu)); nguon=rows.length?'các mã cửa hàng này nhập trong 120 ngày':''; }
    if(!rows.length && d.ht){ rows=await layHet(()=>sb.from('ds_sku_he_thong').select('ma_hang,ten_hang,brand').eq('chuoi',d.ht)); nguon=rows.length?'các mã đang bán ở '+d.ht+' (180 ngày)':''; }

    if(modal?.type!=='audit' || modal.d!==d) return;
    d.sp=[...m.values()].sort((x,y)=>(x.brand+x.ten).localeCompare(y.brand+y.ten,'vi')); d.nguon=nguon||'chưa có mã nào, thêm tay bên dưới';
  }catch(e){ console.warn(e); d.nguon='chưa đọc được danh sách mã'; }
  d.dangTai=false; if(modal?.d===d) rerenderKeepScroll();

async function layLinkAnh(ds){
  const can=ds.filter(p=>!anhUrl.has(p)); if(!can.length) return;
  const r=await sb.storage.from('anh-audit').createSignedUrls(can, 3600); (r.data||[]).forEach(x=>{ if(x.signedUrl) anhUrl.set(x.path, x.signedUrl); });
  if(modal?.type==='audit') rerenderKeepScroll(); else if(view==='hoat-dong') render();
}
function nenAnh(file){   // thu nhỏ ảnh còn cạnh dài 1600px, JPEG 80% cho nhẹ khi tải lên bằng điện thoại
  return new Promise((ok,loi)=>{ const img=new Image(), u=URL.createObjectURL(file);
    img.onload=()=>{ const k=Math.min(1,1600/Math.max(img.width,img.height)), c=document.createElement('canvas'); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(u); c.toBlob(b=>b?ok(b):loi(new Error('Không đọc được ảnh')),'image/jpeg',0.8); };
    img.onerror=()=>{ URL.revokeObjectURL(u); loi(new Error('Không đọc được ảnh')); }; img.src=u; });
}

      ps.map(({b,p})=>{ const t=tachAudit(b.ten); if(!p) return `<tr><td>${esc(t.ch)}</td><td>${esc(t.ht)}</td><td class="num">${fd(b.han)}</td><td colspan="6" class="muted">Chưa có phiếu</td><td>${nutPhieu(a,b)}</td></tr>`;
        const het=(p.san_pham||[]).filter(x=>x.tt==='het');
        return `<tr><td>${esc(p.cua_hang)}</td><td>${esc(p.he_thong)}</td><td class="num">${fd(p.ngay)}${p.gio?' '+esc(p.gio):''}</td><td class="num">${dem(p,'co')}</td><td class="num ${het.length?'late':''}" title="${esc(het.map(x=>x.ten).join('\n'))}">${het.length}</td><td class="num">${mat(p)}</td>

function renderCal(){

  const open=allSteps().filter(x=>isOpen(x.s) && (!calAudit || laBuocAuditCh(x.s)) && (!calPerson || tenNguoi(phuTrach(x.s))===calPerson || (calPerson==='__none' && !tenNguoi(phuTrach(x.s)))))
    .sort((p,q)=>(p.s.han||'9').localeCompare(q.s.han||'9'));

      rows.map(x=>`<tr><td class="num" style="width:110px">${fd(x.s.han)}${x.s.han&&x.s.han<t?`<div class="sub late">Trễ ${diff(x.s.han,t)} ngày</div>`:''}</td><td><b>${esc(x.s.ten)}</b><div class="sub">${esc(x.a.ten)}</div></td><td>${esc(tenNguoi(phuTrach(x.s))||'Chưa giao')}${x.s.trangThai==='cho'?' <span class="sub">(duyệt)</span>':''}</td><td><span class="st-${x.s.trangThai}">${TT[x.s.trangThai]}</span></td><td style="text-align:right;white-space:nowrap">${nutPhieu(x.a,x.s)} <button class="btn sm" data-open="${esc(x.a.id)}" type="button">Xem</button> ${nutXuLy(x.a,x.i,x.s)}</td></tr>`).join('')
    }</tbody></table></div>`:'<div class="empty">Không có việc.</div>'}</div>`; });
  return h+'</section>';

const MAU_BR = {wil:'var(--br-wil)', gungon:'var(--br-gungon)', guyumi:'var(--br-guyumi)', mabay:'var(--br-mabay)'};
function brTag(ten){ const t=String(ten||'').trim(); if(!t) return '—'; const ds=t.split(/[\/,+&]/).map(x=>MAU_BR[boDau(x)]).filter(Boolean);

const boDau = s => String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/gi,'d').toLowerCase().replace(/[^a-z0-9]/g,'');
function khopKenh(chuoi){ const c=boDau(chuoi); if(!c) return null;
  return HT.find(h=>String(h.ten).split('/').map(boDau).some(t=>t && (t===c || (t.length>=3 && c.includes(t))))) || null; }
function khopNhan(nhan){ const c=boDau(nhan); if(!c) return null;
  return NH.find(n=>{ const t=boDau(n.ten); return t.length>=3 && c.includes(t); }) || null; }
function hdCuaLp(lp){ const k=khopKenh(lp.chuoi), n=khopNhan(lp.nhan_hang); if(!k) return [];
  return acts.filter(a=>a.bd && a.kt && a.bd<=lp.ngay_ket_thuc && a.kt>=lp.ngay_bat_dau && a.kenhId===k.id && (!n || a.nhanId===n.id)); }
const dongDau = t => String(t||'').split('\n').map(x=>x.trim()).filter(Boolean)[0]||'';
const thangCua = d => d.slice(0,7);
function themThang(ym,n){ const [y,m]=ym.split('-').map(Number); const d=new Date(Date.UTC(y,m-1+n,1)); return d.toISOString().slice(0,7); }
function tenThang(ym){ const [y,m]=ym.split('-'); return 'T'+Number(m)+'/'+y; }
const LOAI_LP = {onpost:'Onpost', offpost:'Offpost', '':'Không ghi'};
/* ---------- Lịch post 2027: trình bày giống trang Lịch post (thanh thời gian theo hệ thống · brand).
   Lịch 2027 mới có các kỳ của từng hệ thống, chưa rõ chương trình của từng brand: mỗi ô ghi mã kỳ (VD C701, 2701). ---------- */
let lichLoc27 = {chuoi:'', nhan:'', tu:'', soThang:'3', nam:''};
const ky27 = () => lich27.filter(x=>ngay10(x.ntd_bat_dau)).map(x=>({...x, bd:ngay10(x.ntd_bat_dau), kt:ngay10(x.ntd_ket_thuc)||ngay10(x.ntd_bat_dau)}));
const nhan27 = () => NH.filter(n=>n.dang_dung!==false).map(n=>n.ten);
function hdCua27Nhan(x, nhan){ const n=khopNhan(nhan); return hdCua27(x).filter(a=>!n || !a.nhanId || a.nhanId===n.id); }
/* Lịch post dạng cả năm: chọn năm, 12 tháng nằm trên một dải kéo ngang, màn hình thấy 3 / 6 / 12 tháng */
function khungNam(L, dsThang, t){
  const years=[...new Set(dsThang.map(m=>m.slice(0,4)))].sort(), y=t.slice(0,4);
  if(!L.nam || !years.includes(L.nam)) L.nam = years.includes(y) ? y : years[0];
  const so=[3,6,12].includes(+L.soThang)? +L.soThang : 3; L.soThang=String(so); L._years=years;
  const dau=L.nam+'-01-01', cuoi=L.nam+'-12-31', thangs=[]; for(let m=L.nam+'-01',i=0;i<12;i++,m=themThang(m,1)) thangs.push(m);
  return {so, dau, cuoi, tongNgay:diff(dau,cuoi)+1, thangs};
}
function navNam(L,k){
  return `<div class="lp-nav" data-lp-khung="${k}"><span class="lp-nam" role="group" aria-label="Chọn năm">${(L._years||[]).map(n=>`<button type="button" class="btn sm ${n===L.nam?'pri':''}" data-lp-nam="${n}" data-k="${k}" aria-pressed="${n===L.nam}">Năm ${n}</button>`).join('')}</span>
    <span class="lp-cach"></span><button type="button" class="btn sm" data-lp-cuon="-1" data-k="${k}" title="Kéo về 1 tháng">◀</button><button type="button" class="btn sm" data-lp-cuon="0" data-k="${k}">Hôm nay</button><button type="button" class="btn sm" data-lp-cuon="1" data-k="${k}" title="Kéo tới 1 tháng">▶</button>
    <span class="lp-khoang" data-lp-khoang="${k}"></span><span class="lp-goi">Kéo ngang lịch (hoặc giữ Shift + lăn chuột) để xem tháng khác</span></div>`;
}
let lucDoiKho=0, henDoiKho=null;
window.addEventListener('resize', ()=>{ lucDoiKho=Date.now(); clearTimeout(henDoiKho); henDoiKho=setTimeout(()=>{ lucDoiKho=0; apCuonLp(); }, 250); });
const moRong=new Set();   // tên các bảng ở Tổng quan đã bấm "Xem thêm"
function gonBang(){
  main.querySelectorAll('section.card').forEach(sec=>{
    const ten=(sec.querySelector('h2')?.textContent||'').trim(), tb=sec.querySelector('table tbody'); if(!ten||!tb) return;
    const rows=[...tb.children]; if(rows.length<=8) return;
    const mo=moRong.has(ten); rows.forEach((r,i)=>{ r.hidden=!mo && i>=8; });
    const nut=document.createElement('button'); nut.type='button'; nut.className='btn sm xem-them'; nut.dataset.xemThem=ten;
    nut.textContent=mo?'Thu gọn':`Xem thêm ${rows.length-8} dòng`; nut.setAttribute('aria-expanded', String(mo));
    (tb.closest('.scroll')||tb.closest('table')).after(nut);
  });
}
document.getElementById('nutDay').addEventListener('click', e=>{ const a=e.target.closest('[data-nd]'); if(!a) return; calAudit = a.dataset.nd==='audit'; if(calAudit && view==='lich-viec'){ e.preventDefault(); render(); } });

function apCuonLp(){
  document.querySelectorAll('.lp-cuon').forEach(el=>{
    const k=el.dataset.lpK, L=k==='27'?lichLoc27:lichLoc, so=+L.soThang||3;
    const nhan=()=>el.querySelector('.g-lab')?.offsetWidth||210, mw=()=>Math.max(1,(el.scrollWidth-nhan())/12);
    const ghi=()=>{ if(Date.now()-lucDoiKho<600) return; const th=el.scrollLeft/mw(); L._thang=th; const a=Math.max(0,Math.min(11,Math.round(th))), b=Math.min(11,a+so-1), sp=document.querySelector(`[data-lp-khoang="${k}"]`);
      if(sp) sp.innerHTML=`Đang xem <b>T${a+1}</b> – <b>T${b+1}/${L.nam}</b>`; };
    if(L._cuonNam!==L.nam){ L._cuonNam=L.nam; const t=todayStr(); L._thang = t.slice(0,4)===L.nam ? Math.max(0,Math.min(12-so,Number(t.slice(5,7))-2)) : 0; }
    el.scrollLeft=(L._thang||0)*mw(); ghi();
    el.onscroll=ghi;
    el.onmousedown=e=>{ if(e.button!==0||e.target.closest('button,a,select,input')) return;   // kéo bằng chuột (điện thoại, bàn rê dùng vuốt sẵn có)
      e.preventDefault(); const x0=e.clientX, s0=el.scrollLeft; let keo=false;
      const mv=ev=>{ const dx=ev.clientX-x0; if(!keo&&Math.abs(dx)>4){ keo=true; el.classList.add('keo'); } if(keo) el.scrollLeft=s0-dx; };
      const up=()=>{ document.removeEventListener('mousemove',mv); document.removeEventListener('mouseup',up); el.classList.remove('keo'); };
      document.addEventListener('mousemove',mv); document.addEventListener('mouseup',up); };
  });
}
function renderLichPost27(){

  return `<section class="card"><div class="card-h"><div><h2>Lịch post 2027</h2><p>Các kỳ chương trình 2027 của ${dsChuoi.length} hệ thống (${ds.length} kỳ). Chưa rõ chương trình của từng brand nên mỗi ô ghi mã kỳ. Bấm vào ô để xem ngày giao hàng, hạn đăng ký, thời gian PO và tạo hoạt động.</p></div></div>
    <div class="filters">

function renderLichPost(){

/* ---------- Số bán (sell-out) và giao vào (sell-in): dùng cho bảng “Số bán quanh đợt CTKM” trong hoạt động ---------- */
const CHUOI_NGUON = {coop:'Co.op', emart:'Emart'};      // nguồn bán ra -> hệ thống trong app
const soVN = n => n==null||n===''||isNaN(n)?'—':Number(n).toLocaleString('vi-VN',{maximumFractionDigits:0});
const so1 = n => n==null||isNaN(n)?'—':Number(n).toLocaleString('vi-VN',{maximumFractionDigits:1});
const ngay10 = d => String(d||'').slice(0,10);
const thuHai = d => { const x=new Date(d+'T00:00:00Z'); return addDays(d, -((x.getUTCDay()+6)%7)); };
async function layHet(q){ const out=[]; for(let tu=0;;tu+=1000){ const {data,error}=await q().range(tu,tu+999); if(error) throw error; out.push(...data); if(data.length<1000) break; } return out; }
function tenKy(x){ const tu=ngay10(x.tu_ngay), den=ngay10(x.den_ngay);
  if(tu.slice(8)==='01' && addDays(den,1).slice(8)==='01' && tu.slice(0,7)===den.slice(0,7)) return 'T'+Number(tu.slice(5,7))+'/'+tu.slice(0,4);
  return fd(tu).slice(0,5)+'–'+fd(den).slice(0,5); }
function gomKy(rows){ // gộp các dòng cùng kỳ (khi xem tất cả nhãn)
  const m=new Map(); rows.forEach(x=>{ const tu=ngay10(x.tu_ngay), den=ngay10(x.den_ngay), k=tu+'|'+den;
    const o=m.get(k)||m.set(k,{tu,den,so_ngay:diff(tu,den)+1,ky:x.ky,sl:0,ds:0,ton:null,ch:0}).get(k);
    o.sl+=Number(x.so_luong)||0; o.ds+=Number(x.doanh_so)||0; o.ch+=Number(x.so_cua_hang_ban)||0; if(x.ton!=null) o.ton=(o.ton||0)+Number(x.ton); });
  return [...m.values()].sort((a,b)=>a.tu.localeCompare(b.tu)); }
function sellInTrong(si, tu, den){ let sl=0, ds=0, co=false; si.forEach(x=>{ const n=ngay10(x.ngay); if(n>=tu && n<=den){ sl+=Number(x.so_luong)-Number(x.tra_lai_sl||0); ds+=Number(x.doanh_so)||0; co=true; } }); return co?{sl,ds}:null; }
/* ---------- Bảng giá siêu thị (chép từ dashboard) ---------- */

    [...sp.values()].sort(theoTen).map(o=>`<tr><td>${esc(o.nhan_hang||'—')}</td><td>${esc(o.san_pham)}</td>${dsHt.map(ht=>{ const x=o.ht[ht]; return `<td class="n ${x&&x.ghi_chu?'late':''}" ${x&&x.ghi_chu?`title="${esc(x.ghi_chu)}"`:''}>${x?soVN(x.gia_le):'—'}</td>`; }).join('')}</tr>`).join('')

/* Bảng số bán quanh đợt CTKM trong màn chi tiết hoạt động */
/* Thời gian PO giảm giá (siêu thị đặt hàng với giá khuyến mãi) theo hệ thống. Lấy từ sheet "CẬP NHẬT CTKM KÊNH MT 2026":
   PO bắt đầu trước ngày bắt đầu giảm giá cho người tiêu dùng `truoc` ngày, kết thúc trước ngày kết thúc `ketThucSom` ngày. */
const PO_HT = [
  {khoa:'coop', ten:'Co.op', truoc:14, ketThucSom:0}, {khoa:'lotte', ten:'Lotte', truoc:15, ketThucSom:0},
  {khoa:'emart', ten:'Emart', truoc:10, ketThucSom:0}, {khoa:'winmart', ten:'WinMart', truoc:17, ketThucSom:0},
  {khoa:'bigc', ten:'GO!/Big C', truoc:17, ketThucSom:7}, {khoa:'go', ten:'GO!/Big C', truoc:17, ketThucSom:7}];
function poCua(heThong, bd, kt){
  const c=boDau(heThong); if(!c || !bd) return null;
  const q=PO_HT.find(r=>r.khoa==='go' ? c.startsWith('go') : c.includes(r.khoa)); if(!q) return null;
  return {bd:addDays(bd,-q.truoc), kt:addDays(kt||bd,-q.ketThucSom), q};
}
const moTaPo = q => `${q.ten}: PO giảm giá bắt đầu ${q.truoc} ngày trước ngày chạy, ${q.ketThucSom?`kết thúc ${q.ketThucSom} ngày trước ngày kết thúc`:'kết thúc cùng ngày kết thúc'}`;
const chipPo = (ht,bd,kt) => { const p=poCua(ht,bd,kt); return p?`<span class="chip num" title="${esc(moTaPo(p.q))}">PO giảm giá: ${fd(p.bd)} – ${fd(p.kt)}</span>`:''; };
/* Lotte, GO: số bán ra chỉ có ở cửa hàng có CTV (file kiểm tồn) và hàng giao thẳng từng cửa hàng,
   nên so sell-in với kiểm tồn trên CÙNG các cửa hàng CTV (không suy ra cho cả hệ thống). */
const laHtCtv = ht => { const c=boDau(ht); return c.includes('lotte') || c.includes('bigc') || c.startsWith('go'); };
const khoaCh = s => String(s||'').split(/\s+-|-\s+/)[0].normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/gi,'d').toLowerCase()
  .replace(/hang doi cho|sieu thi|lotte mart|lotte|go!\s*\/\s*big\s*c|go!|big\s*c/g,' ').replace(/coats\b/g,'coast').replace(/[^a-z0-9]/g,'');
let kiemTon=null, ctvHd={};
function renderCtv(a){
  if(!a.kenh || !a.bd || !a.kt || !laHtCtv(a.kenh)) return '';
  const po=poCua(a.kenh,a.bd,a.kt)||{bd:a.bd,kt:a.kt,q:null}, dau=addDays(po.bd,-28), cuoi=addDays(a.kt,28);
  const key=[a.kenh,a.nhan,a.bd,a.kt].join('|'), c=ctvHd[a.id];

    sb.from('bo_so_tinh_san').select('du_lieu,nguon_cap_nhat').eq('bo_so','kiem_ton_ctv').maybeSingle()

  if(!c || c.key!==key){ ctvHd[a.id]={key, dang:true};
    layHet(()=>{ let q=sb.from('sell_in_cua_hang').select('*').eq('chuoi',a.kenh).gte('ngay',dau).lte('ngay',cuoi); return a.nhan?q.eq('nhan_hang',a.nhan):q; })
      .then(si=>{ ctvHd[a.id]={key, si}; }).catch(e=>{ console.warn('Chưa đọc được sell-in theo cửa hàng', e); ctvHd[a.id]={key, si:[]}; }).finally(xong); }
  const h2=`<div class="card-h"><div><h2>Ở các cửa hàng có CTV</h2><p>${esc(a.kenh)}${a.nhan?' · '+esc(a.nhan):''} · số bán ra của hệ thống này chỉ có ở cửa hàng có CTV kiểm tồn, nên sell-in cũng chỉ cộng ở đúng các cửa hàng đó (hàng giao thẳng từng cửa hàng). Không suy ra cho cả hệ thống.</p></div></div>`;
  const cc=ctvHd[a.id];
  if(kiemTon==='dang' || !cc || cc.dang) return `<section class="card">${h2}<div class="empty">Đang tải…</div></section>`;
  const htKt = x => laHtCtv(x.he_thong) && (boDau(x.he_thong).includes('lotte') === boDau(a.kenh).includes('lotte'));
  const kt=(kiemTon||[]).filter(x=>htKt(x) && (!a.nhan || x.brand===a.nhan));
  const ch=new Map();   // khóa cửa hàng -> số
  const lay = k => ch.get(k) || ch.set(k,{ten:'',ctv:false,ton_dau:0,nhap:0,ban:0,ton_cuoi:0,coKt:false,tu:'',den:'',si:[0,0,0]}).get(k);
  kt.forEach(x=>{ const o=lay(khoaCh(x.cua_hang)); o.ten=x.cua_hang; o.ctv=true;
    if(x.ban!=null){ o.coKt=true; o.ton_dau+=+x.ton_dau||0; o.nhap+=+x.nhap||0; o.ban+=+x.ban||0; o.ton_cuoi+=+x.ton_cuoi||0;
      const d1=ngay10(x.ngay_dau), d2=ngay10(x.ngay_cuoi); if(d1&&(!o.tu||d1<o.tu)) o.tu=d1; if(d2&&d2>o.den) o.den=d2; } });
  const homQua=addDays(todayStr(),-1), giaiDoan=n=> n<po.bd?0 : n<=po.kt?1 : 2;
  let ngoai={si:[0,0,0], diem:new Set()};
  (cc.si||[]).forEach(x=>{ const n=ngay10(x.ngay); if(n>homQua) return; const sl=(+x.so_luong||0)-(+x.tra_lai_sl||0), k=khoaCh(x.diem_nhan), o=ch.get(k);

/* Tên người làm gõ tay từ trước, không khớp với thành viên nào: cho quản lý gộp về đúng thành viên */
function tenNgoaiDanhSach(){
  const dem=new Map();
  allSteps().forEach(({s})=>{ const k=khoaTen(s.nguoi); if(!k || laThanhVien(k)) return;
    const o=dem.get(k)||{ten:tenNguoi(s.nguoi), so:0, cachViet:new Set()}; o.so++; o.cachViet.add(s.nguoi); dem.set(k,o); });
  return [...dem.entries()].sort((a,b)=>a[1].ten.localeCompare(b[1].ten,'vi'));
}
function renderGopTen(){
  const ds=tenNgoaiDanhSach(); if(!ds.length) return '';
  const tv=tenThanhVien();
  return `<section class="card"><div class="card-h"><h2>Tên người làm chưa khớp thành viên</h2><p>Các tên được gõ tay trước đây. Chọn đúng thành viên rồi bấm “Gộp” để mọi bước mang tên đó chuyển sang thành viên này.</p></div>
  <div class="scroll"><table><thead><tr><th>Tên đang ghi</th><th class="num">Số bước</th><th>Gộp vào thành viên</th><th></th></tr></thead><tbody>${
    ds.map(([k,o],j)=>`<tr><td>${esc(o.ten)}${o.cachViet.size>1?`<div class="sub">${o.cachViet.size} cách viết: ${[...o.cachViet].map(esc).join(', ')}</div>`:''}</td><td class="num">${o.so}</td>
      <td><select id="gop${j}" aria-label="Thành viên để gộp tên ${esc(o.ten)}"><option value="">Chọn thành viên</option>${tv.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}</select></td>
      <td style="text-align:right"><button class="btn sm" data-gop="${j}" type="button">Gộp</button></td></tr>`).join('')
  }</tbody></table></div>${tv.length?'':'<p class="hint" style="padding:0 16px 14px">Chưa có thành viên nào để gộp vào. Hãy thêm thành viên ở bảng trên trước.</p>'}</section>`;
}
function gopTen(j){
  const muc=tenNgoaiDanhSach()[j]; if(!muc) return;
  const [,o]=muc; const dich=document.getElementById('gop'+j)?.value;
  if(!dich) return toast('Hãy chọn thành viên để gộp vào.');
  askConfirm('Gộp tên người làm?', `${o.so} bước đang ghi “${o.ten}” sẽ chuyển sang “${dich}”.`, 'Gộp', ()=>{
    const cu=[...o.cachViet];
    acts.forEach(a=>(a.buoc||[]).forEach(b=>{ if(cu.includes(b.nguoi)) b.nguoi=dich; })); render();
    run('gop', async()=>{ for(const c of cu) must(await sb.from('buoc_cong_viec').update({nguoi_lam:dich}).eq('nguoi_lam',c)); toast(`Đã gộp ${o.so} bước vào ${dich}`); });
  });
}

main.addEventListener('submit', async e=>{
  if(e.target.id!=='authForm') return; e.preventDefault();
  const email=(document.getElementById('aEmail')?.value||'').trim().toLowerCase(); const pass=document.getElementById('aPass')?.value||'';
  authMsg={err:'',ok:''};
  if(authMode!=='reset' && !email){ authMsg.err='Hãy nhập email.'; return renderAuth(); }
  if(authMode!=='forgot' && pass.length<6){ authMsg.err='Mật khẩu cần ít nhất 6 ký tự.'; return renderAuth(); }
  const btn=e.target.querySelector('button[type=submit]'); btn.disabled=true;
  try{
    if(authMode==='login'){ const {error}=await sb.auth.signInWithPassword({email,password:pass}); if(error) throw error; }
    else if(authMode==='signup'){ const {data,error}=await sb.auth.signUp({email,password:pass,options:{emailRedirectTo:location.origin+location.pathname}}); if(error) throw error;
      if(!data.session){ authMode='login'; authMsg.ok='Đã tạo tài khoản. Hãy mở email để xác nhận, rồi quay lại đăng nhập.'; } }
    else if(authMode==='forgot'){ const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname}); if(error) throw error; authMsg.ok='Đã gửi email. Bấm vào link trong email để đặt mật khẩu mới.'; }
    else if(authMode==='reset'){ const {error}=await sb.auth.updateUser({password:pass}); if(error) throw error; authMode='login'; toast('Đã đổi mật khẩu.'); history.replaceState(null,'',location.pathname); return afterAuth(); }
  }catch(err){
    const m=err.message||'';
    authMsg.err = /Invalid login credentials/i.test(m)?'Sai email hoặc mật khẩu.' : /Email not confirmed/i.test(m)?'Email chưa được xác nhận. Hãy mở email xác nhận trước.' : /already registered/i.test(m)?'Email này đã có tài khoản, hãy đăng nhập.' : /rate limit/i.test(m)?'Gửi email quá nhiều lần, hãy thử lại sau ít phút.' : m;
  }
  if(!session || authMode==='forgot') renderAuth();
});

/* ===== Mẫu Audit: 1 lần tạo nhiều lịch audit (hệ thống, cửa hàng, ngày, giờ) ===== */
const laMauAudit = tp => !!tp && /audit/i.test(boDau(tp.ten));
const laBuocDiAudit = b => /diaudit|taidiemban/.test(boDau(b.ten));
const auMoi = (ht) => ({ht: ht||'', ch:'', ngay:'', gio:'09:00'});
let dsCuaHang = null;   // Map tên hệ thống -> [tên cửa hàng], lấy từ sell-in theo điểm nhận hàng 4 tháng gần nhất
function taiDsCuaHang(){
  if(dsCuaHang) return; dsCuaHang = new Map();
  layHet(()=>sb.from('sell_in_cua_hang').select('chuoi,diem_nhan').gte('ngay', addDays(todayStr(),-120)))
    .then(rows=>{ const m=new Map(); rows.forEach(r=>{ const t=String(r.diem_nhan||'').trim(); if(!t) return; if(!m.has(r.chuoi)) m.set(r.chuoi,new Set()); m.get(r.chuoi).add(t); });
      dsCuaHang=new Map([...m].map(([k,v])=>[k,[...v].sort((a,b)=>a.localeCompare(b,'vi'))])); if(modal?.type==='new' && modal.d.audit) rerenderKeepScroll(); })
    .catch(e=>console.warn('Chưa đọc được danh sách cửa hàng', e));
}
const auKhoang = d => { const ng=(d.au||[]).map(r=>r.ngay).filter(Boolean).sort(); return {bd:ng[0]||'', kt:ng[ng.length-1]||''}; };
function buocAudit(tp, d){   // bước của mẫu, riêng bước "Đi audit tại điểm bán" tách thành 1 bước cho mỗi lịch
  const {bd,kt}=auKhoang(d), ra=[]; let chen=false;
  const dongAu = b => (d.au||[]).slice().sort((x,y)=>(x.ngay+x.gio).localeCompare(y.ngay+y.gio)).map(r=>({...b, ten:`Audit: ${r.ch||'(chưa có cửa hàng)'} · ${nameOf(HT,Number(r.ht))||'—'}${r.gio?' · '+r.gio:''}`, han:r.ngay||'', laAu:true}));
  (tp?.buoc||[]).forEach(b=>{ if(!chen && laBuocDiAudit(b)){ ra.push(...dongAu(b)); chen=true; } else ra.push({...b, han:addDays(b.moc==='kt'?kt:bd, b.soNgay)}); });
  if(!chen) ra.push(...dongAu({ten:'', vaiTro:'Trade MKT', moc:'bd', soNgay:0, ketQua:'', nguoiLam:'', nguoiDuyet:''}));
  return ra;
}
function rolesOf(tp){ return [...new Set((tp?.buoc||[]).map(b=>b.vaiTro||'Khác'))]; }
function renderNewModal(){
  const d=modal.d; const tp=templates.find(x=>x.id===d.tplId);

  const rows=(au?buocAudit(tp,d):(tp?.buoc||[]).map(b=>({...b, han:addDays(b.moc==='kt'?d.kt:d.bd, b.soNgay)}))).map(b=>{ const han=b.han; const qua=han&&han<homNay; if(qua) daQua++; return `<tr><td>${esc(b.ten)}</td><td>${d.roles[b.vaiTro||'Khác']||b.nguoiLam?esc(d.roles[b.vaiTro||'Khác']||b.nguoiLam):`<span class="muted">${esc(b.vaiTro||'Chưa giao')}</span>`}</td><td>${b.nguoiDuyet?esc(b.nguoiDuyet):'<span class="muted">—</span>'}</td><td class="num ${qua?'late':''}">${han?fd(han):'<span class="muted">Chọn ngày</span>'}${qua?'<div class="sub late">đã qua</div>':''}</td></tr>`; }).join('');
  return `<div class="dialog" role="dialog" aria-modal="true" aria-labelledby="ttNew"><header><h2 id="ttNew">Tạo hoạt động mới</h2><button class="btn ghost" data-m="close" type="button" aria-label="Đóng">✕</button></header>
  <div class="body">
    <div class="form">
      <div class="field full"><label for="nTpl">Theo quy trình mẫu</label><select id="nTpl" data-n="tplId">${templates.map(t=>`<option value="${esc(t.id)}" ${t.id===d.tplId?'selected':''}>${esc(t.ten)}</option>`).join('')}<option value="" ${!d.tplId?'selected':''}>Không theo mẫu (tự thêm bước)</option></select></div>
      <div class="field full"><label for="nTen">Tên hoạt động</label><input id="nTen" data-n="ten" value="${esc(d.ten)}" placeholder="VD: CTKM catalogue Tết – Co.op"></div>
      ${au?'':`<div class="field"><label for="nNhan">Nhãn hàng</label><select id="nNhan" data-n="nhan">${optObj(NH,d.nhan)}</select></div>
      <div class="field"><label for="nKenh">Kênh / hệ thống</label><select id="nKenh" data-n="kenh">${optObj(HT,d.kenh)}</select></div>
      <div class="field"><label for="nBd">Ngày bắt đầu chạy</label><input id="nBd" type="date" data-n="bd" value="${esc(d.bd)}"></div>
      <div class="field"><label for="nKt">Ngày kết thúc</label><input id="nKt" type="date" data-n="kt" value="${esc(d.kt)}"></div>`}

modalEl.addEventListener('input', e=>{
  const el=e.target; if(!modal) return;
  if(el.dataset.n && (modal.type==='new'||modal.type==='edit') && el.tagName==='INPUT' && el.type!=='date') modal.d[el.dataset.n]=el.value;
  if(modal.type==='audit'){ const d=modal.d;
    if(el.dataset.pa) d[el.dataset.pa]=el.value;
    if(el.dataset.paSp){ const [i,k]=el.dataset.paSp.split(':'); if(d.sp[+i]){ d.sp[+i][k]=el.value; if(k==='so_mat' && +el.value>0 && !d.sp[+i].tt){ d.sp[+i].tt='co'; } } }
    if(el.dataset.paDt){ const [i,k]=el.dataset.paDt.split(':'); if(d.doiThu[+i]) d.doiThu[+i][k]=el.value; }
    if(el.dataset.paPosmGc) d.posm.ghi_chu=el.value;
    return; }
  if(el.dataset.role!=null) modal.d.roles[el.dataset.role]=el.value;
  if(el.dataset.au && modal.type==='new'){ const [i,k]=el.dataset.au.split(':'); if(modal.d.au?.[+i]) modal.d.au[+i][k]=el.value; }
  if(el.dataset.t) modal.d[el.dataset.t]=el.value;
  if(el.dataset.tf) modal.d.buoc[+el.dataset.ti][el.dataset.tf]= el.dataset.tf==='soNgay'? Number(el.value||0) : el.value;
});
modalEl.addEventListener('change', e=>{
  const el=e.target; if(!modal) return;
  if(el.dataset.ttLp!=null){ if(laKhach()) return; const k=el.dataset.ttLp, v=el.value;   // đổi trạng thái chương trình Lịch post
    return run('tt'+k, async()=>{ must(await sb.rpc('dat_trang_thai_lp',{p_khoa:k, p_tt:v}));
      const cu=ttLp.get(k), ls={tt:v, nguoi:me()?.ho_ten||myEmail(), luc:new Date().toISOString()};   // cập nhật ngay trên màn hình, lần tải lại sau sẽ lấy bản chuẩn
      if(v) ttLp.set(k, {...(cu||{}), khoa:k, trang_thai:v, nguoi:ls.nguoi, luc:ls.luc, lich_su:[...((cu&&cu.lich_su)||[]), ls]}); else ttLp.delete(k);
      toast(v?'Đã đổi trạng thái: '+TT_LP_TEN[v]:'Đã bỏ trạng thái'); render(); if(modal?.type==='lp') rerenderKeepScroll(); }); }
  if(el.id==='paFile' && modal.type==='audit'){ [...el.files].forEach(f=>{ if(/^image\//.test(f.type)) modal.d.anhMoi.push({file:f, url:URL.createObjectURL(f)}); }); el.value=''; rerenderKeepScroll(); return; }
  if(modal.type==='audit' && el.dataset.paSp){ rerenderKeepScroll(); return; }
  if(el.id==='eRe'){ modal.d.re=el.checked; return; }
  if(el.dataset.au && modal.type==='new'){ const [i,k]=el.dataset.au.split(':'); if(modal.d.au?.[+i]){ modal.d.au[+i][k]=el.value; if(k==='ht') modal.d.au[+i].ch=''; } rerenderKeepScroll(); return; }
  if(el.dataset.tf){ modal.d.buoc[+el.dataset.ti][el.dataset.tf]= el.dataset.tf==='soNgay'? Number(el.value||0) : el.value; return; }
  if(el.dataset.role!=null){ modal.d.roles[el.dataset.role]=el.value; if(modal.type==='new') rerenderKeepScroll(); return; }
  if(el.dataset.n){ modal.d[el.dataset.n]=el.value;
    if(modal.type==='new'){ if(el.dataset.n==='tplId'){ const tp=templates.find(x=>x.id===el.value); if(tp && !modal.d.tenSua) modal.d.ten=tp.ten; } if(el.dataset.n==='ten') modal.d.tenSua=true; rerenderKeepScroll(); }
  }
});
function rerenderKeepScroll(){ const bg=modalEl.querySelector('.backdrop'); const st=bg?bg.scrollTop:0; renderModal(); const nb=modalEl.querySelector('.backdrop'); if(nb) nb.scrollTop=st; }
modalEl.addEventListener('click', e=>{
  const pt=e.target.closest('[data-pa-tt],[data-pa-posm],[data-pa-xsp],[data-pa-xdt],[data-pa-xanh],[data-pa-xmoi]');
  if(pt && modal?.type==='audit'){ const d=modal.d, ds=pt.dataset;
    if(ds.paTt){ const [i,k]=ds.paTt.split(':'); const x=d.sp[+i]; if(x){ x.tt=x.tt===k?'':k; if(k!=='co'){ if(k==='khong'){ x.so_mat=''; x.gia=''; } if(k==='het') x.so_mat='0'; } } }
    if(ds.paPosm){ const [k,v]=ds.paPosm.split(':'); const b=v==='1'; d.posm[k]=d.posm[k]===b?null:b; }
    if(ds.paXsp!=null) d.sp.splice(+ds.paXsp,1);
    if(ds.paXdt!=null) d.doiThu.splice(+ds.paXdt,1);
    if(ds.paXanh!=null) d.anh.splice(+ds.paXanh,1);
    if(ds.paXmoi!=null){ const [x]=d.anhMoi.splice(+ds.paXmoi,1); if(x) URL.revokeObjectURL(x.url); }
    return rerenderKeepScroll(); }
  const t=e.target.closest('[data-m],[data-tmove],[data-tdel]'); if(!t||!modal) return;
  if(t.dataset.tmove){ const [i,dir]=t.dataset.tmove.split(':').map(Number); const j=i+dir; const b=modal.d.buoc; if(j<0||j>=b.length) return; [b[i],b[j]]=[b[j],b[i]]; rerenderKeepScroll(); return; }
  if(t.dataset.tdel!=null){ modal.d.buoc.splice(+t.dataset.tdel,1); rerenderKeepScroll(); return; }
  const m=t.dataset.m;
  if(m==='bg'){ if(e.target===t) closeModal(); return; }
  if(m==='close') return closeModal();
  if(m==='yes'){ const fn=modal.fn; closeModal(); fn&&fn(); return; }
  if(m==='create') return createAct();
  if(modal.type==='audit'){ const d=modal.d, ds=t.dataset;
    if(m==='pa-luu') return luuPhieu(false);
    if(m==='pa-luu-xong') return luuPhieu(true);
    if(m==='pa-tatca'){ d.sp.forEach(x=>{ if(!x.tt) x.tt='co'; }); return rerenderKeepScroll(); }
    if(m==='pa-them-dt'){ d.doiThu.push({ten:'',hoat_dong:'',gia:''}); rerenderKeepScroll(); setTimeout(()=>modalEl.querySelector(`[data-pa-dt="${d.doiThu.length-1}:ten"]`)?.focus(),0); return; }
    if(m==='pa-them-sp'){ const v=(modalEl.querySelector('#paSpMoi')?.value||'').trim(); if(!v) return toast('Gõ tên mã cần thêm.'); d.sp.push({ma:'',ten:v,brand:'',tt:'',so_mat:'',gia:'',tay:true}); return rerenderKeepScroll(); }
  }
  if(m==='au-them'){ const cu=modal.d.au[modal.d.au.length-1]; modal.d.au.push({...auMoi(cu?.ht), ngay:cu?.ngay?addDays(cu.ngay,1):'', gio:cu?.gio||'09:00'}); rerenderKeepScroll(); setTimeout(()=>document.getElementById('auCh'+(modal.d.au.length-1))?.focus(),0); return; }
  if(m==='au-xoa'){ if(modal.d.au.length>1) modal.d.au.splice(+t.dataset.i,1); rerenderKeepScroll(); return; }
  if(m==='save-edit') return saveEdit();
  if(m==='tadd'){ modal.d.buoc.push({ten:'',vaiTro:'Trade MKT',moc:'bd',soNgay:0,ketQua:'',nguoiLam:'',nguoiDuyet:''}); rerenderKeepScroll(); return; }
  if(m==='tsave') return saveTpl();
  if(m==='tralai-ok') return traLai();
  if(m==='tao-lp'){ const id=modal.d.id; closeModal(); if(!laKhach()) taoTuLp(id); return; }
  if(m==='tao-27'){ const {ma, nhan}=modal.d; closeModal(); if(laKhach()) return; taoTu27(ma); const n=nhan?khopNhan(nhan):null; if(n && modal?.d){ modal.d.nhan=String(n.id); modal.d.ten=String(modal.d.ten||"").replace(/^CTKM /,"CTKM "+n.ten+" "); renderModal(); } return; }
  if(m==='mo-hd'){ const id=t.dataset.id; closeModal(); selectedId=id; view='hoat-dong'; location.hash='hoat-dong'; render(); return; }
  if(m==='tdelete'){ const id=modal.d.id; askConfirm('Xóa quy trình mẫu?','Các hoạt động đã tạo từ mẫu này vẫn giữ nguyên.','Xóa',()=>{ templates=templates.filter(x=>x.id!==id); render(); run('qt'+id,()=>sb.from('quy_trinh').delete().eq('id',id)); }); return; }
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape' && modal) closeModal(); });

/* ---------- tạo / sửa ---------- */
function openNew(){
  const tp=templates[0];
  modal={type:'new', d:{tplId:tp?tp.id:'', ten:tp?tp.ten:'', nhan:NH[0]?String(NH[0].id):'', kenh:HT[0]?String(HT[0].id):'', bd:addDays(todayStr(),30), kt:addDays(todayStr(),44), roles:{}, tenSua:false}};
  renderModal(); setTimeout(()=>document.getElementById('nTen')?.focus(),0);
}
function createAct(){
  const d=modal.d; if(!d.ten.trim()) return toast('Hãy nhập tên hoạt động.');
  const tpA=templates.find(x=>x.id===d.tplId);
  if(laMauAudit(tpA)){
    const thieu=d.au.findIndex(r=>!r.ht||!String(r.ch).trim()||!r.ngay||!r.gio);
    if(thieu>=0) return toast(`Dòng ${thieu+1}: hãy chọn đủ hệ thống, tên cửa hàng, ngày và giờ audit.`);
    const {bd,kt}=auKhoang(d), htDs=[...new Set(d.au.map(r=>r.ht))];
    const row={ten:d.ten.trim(), quy_trinh_id:tpA.id, quy_trinh_ten:tpA.ten, nhan_hang_id:null, he_thong_id:htDs.length===1?Number(htDs[0]):null, ngay_bat_dau:bd, ngay_ket_thuc:kt};
    const steps=buocAudit(tpA,d).map((b,i)=>({thu_tu:i+1, ten:b.ten, vai_tro:b.vaiTro||'', nguoi_lam:(d.roles[b.vaiTro||'Khác']||b.nguoiLam||'').trim(), nguoi_duyet:(b.nguoiDuyet||'').trim(),
      moc:b.laAu?null:MOC_DB[b.moc||'bd'], so_ngay:b.laAu?null:Number(b.soNgay||0), han:b.han||null, ket_qua:b.ketQua||''}));
    closeModal(); toast('Đang tạo hoạt động…');
    return run('tao-hd', async()=>{
      const hd=must(await sb.from('hoat_dong').insert(row).select('id').single());
      must(await sb.from('buoc_cong_viec').insert(steps.map(s=>({...s, hoat_dong_id:hd.id}))));
      selectedId=hd.id; view='hoat-dong'; if(location.hash!=='#hoat-dong') location.hash='hoat-dong';
      toast(`Đã tạo: ${row.ten} (${d.au.length} lịch audit)`);
    });
  }
  if(!d.bd||!d.kt) return toast('Hãy chọn ngày bắt đầu và ngày kết thúc.');
  if(d.kt<d.bd) return toast('Ngày kết thúc phải sau ngày bắt đầu.');
  const tp=templates.find(x=>x.id===d.tplId);
  const row={ten:d.ten.trim(), quy_trinh_id:tp?.id||null, quy_trinh_ten:tp?.ten||'', nhan_hang_id:d.nhan?Number(d.nhan):null, he_thong_id:d.kenh?Number(d.kenh):null, ngay_bat_dau:d.bd, ngay_ket_thuc:d.kt};
  const steps=(tp?.buoc||[]).map((b,i)=>({thu_tu:i+1, ten:b.ten, vai_tro:b.vaiTro||'', nguoi_lam:(d.roles[b.vaiTro||'Khác']||b.nguoiLam||'').trim(), nguoi_duyet:(b.nguoiDuyet||'').trim(), moc:MOC_DB[b.moc||'bd'], so_ngay:Number(b.soNgay||0), han:addDays(b.moc==='kt'?d.kt:d.bd,b.soNgay)||null, ket_qua:b.ketQua||''}));
  closeModal(); toast('Đang tạo hoạt động…');
  run('tao-hd', async()=>{
    const hd=must(await sb.from('hoat_dong').insert(row).select('id').single());
    if(steps.length) must(await sb.from('buoc_cong_viec').insert(steps.map(s=>({...s, hoat_dong_id:hd.id}))));
    selectedId=hd.id; view='hoat-dong'; if(location.hash!=='#hoat-dong') location.hash='hoat-dong';
    toast('Đã tạo: '+row.ten);
  });
}
function saveEdit(){
  const d=modal.d; const a=acts.find(x=>x.id===d.id); if(!a) return closeModal();
  if(!d.ten.trim()) return toast('Hãy nhập tên hoạt động.');
  if(!d.bd||!d.kt) return toast('Hãy chọn đủ ngày.');
  if(d.kt<d.bd) return toast('Ngày kết thúc phải sau ngày bắt đầu.');
  const row={ten:d.ten.trim(), nhan_hang_id:d.nhan?Number(d.nhan):null, he_thong_id:d.kenh?Number(d.kenh):null, ngay_bat_dau:d.bd, ngay_ket_thuc:d.kt};

function updateStep(id,i,field,val){
  const a=acts.find(x=>x.id===id); const s=a?.buoc[i]; if(!s) return;
  if((s[field]??'')===val) return;
  const cuTT=s.trangThai;
  if(field==='ten' && !val.trim()){ toast('Tên bước không được để trống.'); return render(); }
  const patch={};
  if(field==='ten'){ s.ten=val.trim(); patch.ten=s.ten; }
  if(field==='nguoi'){ s.nguoi=val.trim(); patch.nguoi_lam=s.nguoi; }
  if(field==='nguoiDuyet'){
    if(s.nguoiDuyet && !isManager()){ toast('Chỉ quản lý mới đổi hoặc bỏ người duyệt.'); return render(); }
    s.nguoiDuyet=val.trim(); patch.nguoi_duyet=s.nguoiDuyet;
    if(!s.nguoiDuyet && s.trangThai==='cho'){ s.trangThai='dang'; patch.trang_thai='dang_lam'; }
  }
  if(field==='han'){ s.han=val; patch.han=val||null; }
  if(field==='ketQua'){ s.ketQua=val; patch.ket_qua=val; }
  if(field==='ghiChu'){ s.ghiChu=val; patch.ghi_chu=val; }
  if(field==='ngayXong'){ if(s.trangThai!=='xong') return; s.ngayXong=val||todayStr(); patch.ngay_xong=s.ngayXong; }
  if(field==='trangThai'){
    if(val==='cho' && !s.nguoiDuyet) return render();
    if(val==='xong' && s.nguoiDuyet && !coQuyenDuyet(s)) val='cho';              // người làm bấm hoàn tất -> gửi duyệt
    if(s.trangThai==='xong' && s.nguoiDuyet && val!=='xong' && !coQuyenDuyet(s)){ toast('Bước đã được duyệt. Chỉ người duyệt hoặc quản lý mới mở lại được.'); return render(); }
    if(s.trangThai===val) return render();
    const daDuyet = val==='xong' && !!s.nguoiDuyet;
    s.trangThai=val; patch.trang_thai=TT_DB[val];
    if(val==='xong'){ if(!s.ngayXong) s.ngayXong=todayStr(); } else s.ngayXong=''; patch.ngay_xong=s.ngayXong||null;
    if(val==='cho'){ s.ngayNop=todayStr(); patch.ngay_nop=s.ngayNop; }
    if(daDuyet){ s.lyDoTra=''; patch.ly_do_tra=''; }
  }
  render();
  run('b'+s.id, ()=>sb.from('buoc_cong_viec').update(patch).eq('id',s.id));
  if(field==='trangThai' && (s.trangThai==='xong'||s.trangThai==='cho') && cuTT!==s.trangThai){
    const msg = s.trangThai==='cho' ? `Đã gửi ${tenNguoi(s.nguoiDuyet)} duyệt: ${s.ten}` : (s.nguoiDuyet?'Đã duyệt: ':'Đã đánh dấu xong: ')+s.ten;
    if(!s.nguoiDuyet || coQuyenDuyet(s)) toastHoanTac(msg, ()=>updateStep(id,i,'trangThai',cuTT)); else toast(msg); }
}

function moTim(){
  if(!authed || document.getElementById('timNhanh')) return;

  const el=document.createElement('div'); el.id='timNhanh'; el.className='tim-nen';

  document.body.appendChild(el);

function readHash(){ const [h,id]=location.hash.replace('#','').split('/'); if(h==='lich-post-2027'){ location.replace('#lich-post'); return; }   // trang đã gỡ if(h==='sell-out'){ location.replace('#bc-sell-out'); return; } // trang Số bán cũ đã chuyển sang Báo cáo MT
  view=VIEWS.includes(h)?h:'tong-quan'; if(view==='hoat-dong' && id) selectedId=decodeURIComponent(id); } // #hoat-dong/<mã> mở thẳng 1 hoạt động (dùng cho link trong email nhắc hạn)
window.addEventListener('hashchange', ()=>{ readHash(); if(view!=='hoat-dong') selectedId=null; render(); });
['nav','thanhBen'].forEach(id=>document.getElementById(id)?.addEventListener('click', e=>{ const a=e.target.closest('a'); if(!a) return; if(a.dataset.v==='hoat-dong' && location.hash==='#hoat-dong'){ selectedId=null; render(); } else selectedId=null; }));
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && authed && Date.now()-lanTai>60000) scheduleReload(); });

/* ---------- khởi động ---------- */
async function afterAuth(){
  if(channel){ sb.removeChannel(channel); channel=null; }
  authed=false; loaded=false; members=[];
  if(!session){ renderAuth(); return; }
  if(authMode==='reset'){ renderAuth(); return; }
  let {data:ok,error}=await sb.rpc('duoc_xem');
  if(error && /duoc_xem/.test(errText(error))) ({data:ok,error}=await sb.rpc('la_thanh_vien')); // cơ sở dữ liệu chưa cập nhật bản có vai trò khách
  if(error){ main.innerHTML=`<div class="auth"><h2>Chưa kết nối được</h2><p class="err">${esc(errText(error))}</p><p class="hint">Kiểm tra đã chạy file thiết kế cơ sở dữ liệu trong Supabase chưa.</p></div>`; setChrome(); return; }
  if(!ok){ setChrome(); main.innerHTML=`<div class="auth"><h2>Chưa có quyền truy cập</h2><p>Email <b>${esc(myEmail())}</b> chưa có trong danh sách thành viên.</p><p class="hint">Nhờ quản lý vào mục “Thành viên” thêm email này, rồi tải lại trang.</p></div>`; return; }
  authed=true; readHash(); render();
  await loadAll();
  if(channel){ try{ sb.removeChannel(channel); }catch(e){} }
  channel=sb.channel('thay-doi-'+Math.random().toString(36).slice(2)).on('postgres_changes',{event:'*',schema:'public'},()=>scheduleReload()).subscribe();
}
/* ---------- Họa tiết theo mùa: Noel (15/11 – 26/12), Tết (27 ngày trước Mùng 1 đến 14 ngày sau) ---------- */
const NGAY_TET = {'2027':'2027-02-06', '2028':'2028-01-26', '2029':'2029-02-13'};
const MUA = (()=>{
  const ep=new URLSearchParams(location.search).get('mua'); if(['noel','tet','tat'].includes(ep)) return ep==='tat'?'':ep;
  const t=todayStr(), md=t.slice(5);
  if(md>='11-15' && md<='12-26') return 'noel';
  const tet=NGAY_TET[t.slice(0,4)]; if(tet && t>=addDays(tet,-27) && t<=addDays(tet,14)) return 'tet';
  return '';
})();
function trangTriMua(){
  if(!MUA) return;
  document.body.classList.add('mua-'+MUA);
  const lop=document.querySelector('.mua-lop'), nut=document.getElementById('nutMua');
  const HOA='<svg viewBox="0 0 20 20" width="100%" height="100%"><g fill="#f2b632">'+[0,72,144,216,288].map(g=>`<ellipse cx="10" cy="4.6" rx="3.4" ry="4.6" transform="rotate(${g} 10 10)"/>`).join('')+'</g><circle cx="10" cy="10" r="2.2" fill="#d8322b"/></svg>';
  const veRoi=()=>{ lop.innerHTML=Array.from({length:MUA==='noel'?45:16},()=>{ const c=MUA==='noel'?6+Math.random()*8:8+Math.random()*12;
    return `<i style="left:${Math.random()*100}%;font-size:${c}px;width:${c}px;height:${c}px;opacity:${(MUA==='noel'?.75+Math.random()*.25:.45+Math.random()*.45).toFixed(2)};--lac:${Math.round(Math.random()*80-40)}px;animation-duration:${(MUA==='noel'?18+Math.random()*14:9+Math.random()*10).toFixed(1)}s;animation-delay:-${(Math.random()*24).toFixed(1)}s">${MUA==='noel'?'':HOA}</i>`; }).join(''); };
  let tat=false; try{ tat=localStorage.getItem('tatHieuUngMua')==='1'; }catch(_){}
  const capNhat=()=>{ if(tat) lop.innerHTML=''; else veRoi(); nut.textContent = MUA==='noel' ? (tat?'❄ Bật tuyết rơi':'❄ Tắt tuyết rơi') : (tat?'🌼 Bật hoa mai rơi':'🌼 Tắt hoa mai rơi'); };
  nut.hidden=false; capNhat();
  nut.addEventListener('click', ()=>{ tat=!tat; try{ localStorage.setItem('tatHieuUngMua', tat?'1':'0'); }catch(_){} capNhat(); });
}
trangTriMua();
(async function init(){
  if(!CFG.url || /DIEN_/.test(CFG.url) || !CFG.khoa || /DIEN_/.test(CFG.khoa)){
    main.innerHTML=`<div class="auth"><h2>Chưa cấu hình</h2><p>Hãy mở file <b>cau-hinh.js</b> và điền <b>Project URL</b> cùng <b>khóa công khai</b> của Supabase.</p></div>`; return;
  }
  if(!window.supabase){ main.innerHTML=`<div class="auth"><h2>Không tải được thư viện</h2><p class="hint">Kiểm tra kết nối mạng rồi tải lại trang.</p></div>`; return; }
  sb=window.supabase.createClient(CFG.url, CFG.khoa);
  sb.auth.onAuthStateChange((ev,s)=>{
    const changed=(s?.user?.id)!==(session?.user?.id); session=s;
    if(ev==='PASSWORD_RECOVERY'){ authMode='reset'; setTimeout(renderAuth,0); return; }
    if(changed && ev!=='INITIAL_SESSION') setTimeout(afterAuth,0);
  });
  const {data}=await sb.auth.getSession(); session=data.session;
  afterAuth();
})();
</script>
